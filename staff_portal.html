function readableError(err) {
  const raw = (err && (err.message || err.error_description || err.msg)) || "";
  const status = err && err.status;
  if (status === 429 || /rate limit|too many/i.test(raw)) return "Too many attempts. Please wait a minute and try again.";
  if (status === 500 || /unexpected_failure/i.test(raw)) return "Email could not be sent (server error). Contact the administrator.";
  if (/expired|invalid/i.test(raw)) return "That code is invalid or expired. Request a new one.";
  return raw || "Something went wrong. Please try again.";
}

// ── JSON validation ───────────────────────────────────────────────────────
function validateJSON(json) {
  const errors = [], warnings = [];
  if (!json.report_metadata)  errors.push("Missing section: report_metadata");
  if (!json.audit_summary)    errors.push("Missing section: audit_summary");
  if (!Array.isArray(json.areas)) errors.push("Missing section: areas (must be an array)");

  if (json.report_metadata) {
    const m = json.report_metadata;
    ["client_name","unit_name","fy","audit_period_from","audit_period_to"].forEach(k=>{
      if (!m[k]) errors.push(`report_metadata.${k} is missing`);
    });
    if (!m.udin)             warnings.push("UDIN not found in JSON — please verify");
    if (!m.overall_rating)   warnings.push("overall_rating not found in JSON");
    if (!m.auditors?.length) warnings.push("Auditor names not found in JSON");
  }
  if (json.audit_summary?.area_wise_summary) {
    json.audit_summary.area_wise_summary.forEach(row=>{
      const sum=(row.critical||0)+(row.high||0)+(row.medium||0)+(row.low||0);
      if (sum!==row.total) errors.push(`Area "${row.area}": risk counts sum to ${sum} but total says ${row.total}`);
    });
  }
  if (Array.isArray(json.areas)) {
    json.areas.forEach(area=>{
      if (!area.area_name) errors.push("An area is missing area_name");
      (area.observations||[]).forEach((obs,i)=>{
        if (!obs.title) warnings.push(`${area.area_name} obs #${i+1}: missing title`);
        if (!obs.risk_level) errors.push(`${area.area_name} obs #${i+1}: missing risk_level`);
        else if (!["Critical","High","Medium","Low"].includes(obs.risk_level))
          errors.push(`${area.area_name} obs #${i+1}: invalid risk_level "${obs.risk_level}"`);
      });
    });
  }
  return { errors, warnings, clarifications: json.clarifications_needed || [] };
}

      try{
        const d=JSON.parse(e.target.result.trim()); setJsonData(d);

    r.readAsText(file);

  const canValidate = clientName&&assignmentId&&unitId&&fy&&jsonData&&reportFile;

  const runValidation=()=>{ setStep("validating");
    setTimeout(()=>{ setResult(validateJSON(jsonData)); setAnswers({}); setStep("validated"); },600);
  };

  const submit=async()=>{
    setStep("submitting");
    try{
      const unit = units.find(u=>String(u.id)===String(unitId));
      const stamp = Date.now();
      const safe = s => (s||"").replace(/[^a-zA-Z0-9._-]/g,"_");
      let reportPath=null, annexPath=null;

      if (reportFile) {
        reportPath = `${safe(clientName)}/${safe(unit?.unit_name)}/${fy}/${stamp}_${safe(reportFile.name)}`;
        const { error } = await sb.storage.from("reports").upload(reportPath, reportFile, { upsert:false });

      if (annexureFile) {

        const { error } = await sb.storage.from("reports").upload(annexPath, annexureFile, { upsert:false });

        client_name: clientName,
        unit_id: parseInt(unitId),
        unit_name: unit?.unit_name || "",
        assignment_id: parseInt(assignmentId),
        fy,
        status: "Draft",
        uploaded_by: user.email,
        period: meta ? `${meta.periodFrom||""}${meta.periodFrom&&meta.periodTo?" – ":""}${meta.periodTo||""}` : "",
        udin: meta?.udin || "",

        report_file: reportPath,
        annexure_file: annexPath,

              <Sel label="UNIT" value={unitId} onChange={setUnitId} disabled={!assignmentId} required placeholder="Select unit..."

              <Sel label="FINANCIAL YEAR" value={fy} onChange={setFy} options={["2023-24","2024-25","2025-26","2026-27"]} required placeholder="Select FY..."/>

          <div style={{fontSize:13,fontWeight:800,color:P.slate,marginBottom:16,paddingBottom:12,borderBottom:`1px solid ${P.border}`,display:"flex",alignItems:"center",gap:8}}>
            <span style={{background:P.blue,color:"#fff",width:22,height:22,borderRadius:6,fontSize:11,fontWeight:900,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>2</span>
            Upload JSON
          </div>
          <FileDropZone label="Structured JSON File" accept=".json" file={jsonFile} onFile={handleJson} required
            hint="Generated by the staff prompt template via Claude / ChatGPT"/>
          {meta&&(
            <div style={{marginTop:16,paddingTop:16,borderTop:`1px solid ${P.border}`}}>
              <div style={{fontSize:11,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:10}}>📋 METADATA FROM JSON — AUTO-FILLED</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <MetaField label="PERIOD FROM" value={fmtDate(meta.periodFrom)}/>
                <MetaField label="PERIOD TO" value={fmtDate(meta.periodTo)}/>
              </div>
              <div style={{marginTop:10}}><MetaField label="AUDITORS" value={meta.auditors}/></div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
                <MetaField label="UDIN" value={meta.udin} mono/>
                <MetaField label="OVERALL RATING" value={meta.rating}/>
              </div>
            </div>
          )}
        </div>

        {/* Step 3 */}
        <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px"}}>
          <div style={{fontSize:13,fontWeight:800,color:P.slate,marginBottom:16,paddingBottom:12,borderBottom:`1px solid ${P.border}`,display:"flex",alignItems:"center",gap:8}}>
            <span style={{background:P.blue,color:"#fff",width:22,height:22,borderRadius:6,fontSize:11,fontWeight:900,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>3</span>
            Upload Files
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <FileDropZone label="Audit Report" accept=".pdf,.pptx,.ppt" file={reportFile} onFile={setReportFile} required tag="MD Download"
              hint="Original report PDF or PPTX — available for the MD to download from the dashboard"/>
            <FileDropZone label="Annexure File" accept=".pdf,.xlsx,.xls,.csv" file={annexureFile} onFile={setAnnexureFile} tag="Optional"
              hint="Skip if annexures are already part of the report PDF"/>
          </div>
        </div>
      </div>

      {/* RIGHT */}
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px"}}>
          <div style={{fontSize:13,fontWeight:800,color:P.slate,marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${P.border}`}}>✅ Validate & Submit</div>
          <div style={{marginBottom:18}}>
            {[
              {label:"Client, assignment & unit selected",done:!!clientName&&!!assignmentId&&!!unitId},
              {label:"Financial year selected",done:!!fy},
              {label:"JSON uploaded & parsed",done:!!jsonData},
              {label:"Metadata auto-filled",done:!!meta?.periodFrom},
              {label:"Audit report uploaded",done:!!reportFile},
            ].map(it=>(
              <div key={it.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{width:18,height:18,borderRadius:"50%",flexShrink:0,background:it.done?P.greenLt:P.bg,
                  border:`1.5px solid ${it.done?P.green:P.border}`,display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:11,color:it.done?P.green:P.muted}}>{it.done?"✓":""}</div>
                <span style={{fontSize:12,color:it.done?P.slate:P.muted,fontWeight:it.done?600:400}}>{it.label}</span>
              </div>
            ))}
          </div>

          {step==="form"&&<Btn onClick={runValidation} disabled={!canValidate} full>
            {canValidate?"Validate JSON →":"Complete steps first"}</Btn>}
          {step==="validating"&&<div style={{textAlign:"center",padding:"18px 0",color:P.muted,fontSize:13}}>Validating JSON...</div>}
          {step==="submitting"&&<div style={{textAlign:"center",padding:"18px 0",color:P.green,fontSize:13,fontWeight:600}}>Uploading files and submitting...</div>}

          {step==="validated"&&result&&(
            <div>
              {result.errors.length>0&&(
                <div style={{background:P.redLt,border:`1px solid ${P.redBd}`,borderRadius:10,padding:"14px 16px",marginBottom:12}}>
                  <div style={{fontWeight:800,color:P.red,fontSize:13,marginBottom:8}}>⛔ {result.errors.length} error{result.errors.length>1?"s":""} — cannot submit</div>
                  {result.errors.map((e,i)=><div key={i} style={{fontSize:12,color:"#991B1B",marginBottom:4,paddingLeft:10,borderLeft:`2px solid ${P.red}`}}>• {e}</div>)}
                  <Btn size="sm" color="red" outline onClick={()=>{setJsonFile(null);setJsonData(null);setMeta(null);setResult(null);setStep("form");}}>← Re-upload corrected JSON</Btn>
                </div>
              )}
              {result.warnings.length>0&&(
                <div style={{background:P.amberLt,border:`1px solid ${P.amberBd}`,borderRadius:10,padding:"14px 16px",marginBottom:12}}>
                  <div style={{fontWeight:800,color:P.amber,fontSize:13,marginBottom:8}}>⚠️ {result.warnings.length} warning{result.warnings.length>1?"s":""}</div>
                  {result.warnings.map((w,i)=><div key={i} style={{fontSize:12,color:"#92400E",marginBottom:4,paddingLeft:10,borderLeft:`2px solid ${P.amber}`}}>• {w}</div>)}
                </div>
              )}
              {result.clarifications.length>0&&(
                <div style={{background:P.amberLt,border:`1px solid ${P.amberBd}`,borderRadius:10,padding:"14px 16px",marginBottom:12}}>
                  <div style={{fontWeight:800,color:P.amber,fontSize:13,marginBottom:10}}>🤖 {result.clarifications.length} item{result.clarifications.length>1?"s":""} flagged by AI</div>
                  {result.clarifications.map((c,i)=>(
                    <div key={i} style={{background:"#fff",borderRadius:8,padding:"10px 12px",marginBottom:8,border:`1px solid ${P.amberBd}`}}>
                      <div style={{fontSize:11,fontWeight:700,color:P.amber,marginBottom:4}}>FIELD: {c.field}</div>
                      <div style={{fontSize:12,color:"#78350F",marginBottom:6}}>{c.question}</div>
                      <input placeholder={`AI value: ${c.extracted_value} — type correction or leave blank`}
                        value={answers[i]||""} onChange={e=>setAnswers(a=>({...a,[i]:e.target.value}))}
                        style={{width:"100%",border:`1px solid ${answers[i]?P.green:P.amberBd}`,borderRadius:7,padding:"7px 10px",fontSize:12,outline:"none"}}/>
                    </div>
                  ))}
                </div>
              )}
              {!result.errors.length&&(
                <>
                  <div style={{background:P.greenLt,border:`1px solid ${P.greenBd}`,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
                    <div style={{fontWeight:800,color:P.green,fontSize:13}}>✅ JSON validated</div>
                    <div style={{fontSize:12,color:"#166534",marginTop:2}}>Submitting sends this for approval — it won't be visible to the client until approved.</div>
                  </div>
                  <Btn onClick={submit} color="green" full size="lg">Submit for Approval →</Btn>
                </>
              )}
            </div>
          )}
        </div>

        <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px"}}>
          <div style={{fontSize:13,fontWeight:800,color:P.slate,marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${P.border}`}}>📖 How to prepare the JSON</div>
          {["Open the Staff Prompt Template document","Copy the full prompt into Claude or ChatGPT",
            "Attach the report PPTX or PDF to the chat","Save the AI output as a .json file",
            "Upload it here — the portal validates automatically"].map((t,i)=>(
            <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
              <div style={{width:22,height:22,background:P.blueLt,color:P.blue,borderRadius:6,fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</div>
              <span style={{fontSize:13,color:P.mid,lineHeight:1.5}}>{t}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── MY UPLOADS ────────────────────────────────────────────────────────────
function MyUploads({ reports }) {
  if (!reports.length) return null;
  const fmt=s=>{try{return new Date(s).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}catch{return"";}};
  return (
    <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px",marginTop:20}}>
      <div style={{fontSize:14,fontWeight:800,color:P.slate,marginBottom:16,paddingBottom:12,borderBottom:`1px solid ${P.border}`}}>
        📤 My Uploads <span style={{fontSize:12,fontWeight:500,color:P.muted}}>— {reports.length} report{reports.length>1?"s":""}</span>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr>{["Client / Unit","FY","Status","Uploaded"].map(h=>
          <th key={h} style={{padding:"9px 12px",textAlign:"left",color:P.muted,fontSize:11,fontWeight:700,borderBottom:`2px solid ${P.border}`,background:"#F8FAFC"}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {reports.map((r,i)=>(
            <React.Fragment key={r.id}>
              <tr style={{borderBottom:r.rejected_reason?"none":`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA"}}>
                <td style={{padding:"10px 12px"}}>
                  <div style={{fontWeight:700,color:P.slate}}>{r.client_name}</div>
                  <div style={{fontSize:11,color:P.muted}}>{r.unit_name}</div>
                </td>
                <td style={{padding:"10px 12px",color:P.mid}}>{r.fy}</td>
                <td style={{padding:"10px 12px"}}><StatusBadge status={r.status}/></td>
                <td style={{padding:"10px 12px",fontSize:11,color:P.muted}}>{fmt(r.created_at)}</td>
              </tr>
              {r.status==="Rejected"&&r.rejected_reason&&(
                <tr style={{borderBottom:`1px solid ${P.border}`,background:P.redLt}}>
                  <td colSpan={4} style={{padding:"8px 12px",fontSize:12,color:"#991B1B"}}>
                    <strong>Rejected:</strong> {r.rejected_reason} — please correct and upload again.
                  </td>
                </tr>
              )}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App() {
  const [authState,setAuthState]=useState("loading");
  const [user,setUser]=useState(null);
  const [clients,setClients]=useState([]);
  const [assignments,setAssignments]=useState([]);
  const [units,setUnits]=useState([]);
  const [myReports,setMyReports]=useState([]);
  const [toast,setToast]=useState(null);
  const showToast=(msg,type="success")=>setToast({msg,type});

  const loadData = async (u) => {
    try{
      const [{data:cl},{data:asg},{data:un}] = await Promise.all([
        sb.from("clients").select("*").eq("status","Active").order("client_name"),
        sb.from("assignments").select("*").order("id"),
        sb.from("units").select("*").order("unit_name"),
      ]);
      const allowed = u.assignedClients?.length ? u.assignedClients : null;
      setClients((cl||[]).filter(c=>!allowed||allowed.includes(c.client_name)));
      setAssignments((asg||[]).filter(a=>!allowed||allowed.includes(a.client_name)));
      setUnits((un||[]).filter(x=>!allowed||allowed.includes(x.client_name)));
      const {data:rep}=await sb.from("reports").select("*").eq("uploaded_by",u.email).order("id",{ascending:false});
      setMyReports(rep||[]);
    }catch(e){ showToast("Could not load data: "+e.message,"error"); }
  };

  const resolveUser = async (sess) => {
    const email=sess?.user?.email?.toLowerCase();
    if(!email){ setAuthState("login"); return; }
    if(email===SUPER_ADMIN){
      const u={email,name:"Ashish Gupta",role:"Super Admin",perms:defaultPerms("Super Admin"),assignedClients:[]};
      setUser(u); setAuthState("ready"); await loadData(u); return;
    }
    const {data,error}=await sb.from("app_users").select("*").eq("email",email).eq("status","Active").maybeSingle();
    if(error||!data){ setAuthState("denied"); return; }
    const perms=effectivePerms(data.role,data.permissions);
    if(!perms.upload_reports){ setAuthState("denied"); return; }
    const u={email,name:data.name||email,role:data.role,perms,assignedClients:data.assigned_clients||[]};
    setUser(u); setAuthState("ready"); await loadData(u);
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{ if(data.session) resolveUser(data.session); else setAuthState("login"); });
    const {data:sub}=sb.auth.onAuthStateChange((_e,sess)=>{ if(sess) resolveUser(sess); else {setUser(null);setAuthState("login");} });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const signOut=async()=>{ await sb.auth.signOut(); };

  if(authState==="loading") return <div style={{minHeight:"100vh",background:P.ink,display:"flex",alignItems:"center",justifyContent:"center",color:"#9CA3AF",fontSize:14}}>Loading...</div>;
  if(authState==="login") return <LoginScreen/>;
  if(authState==="denied") return (
    <div style={{minHeight:"100vh",background:P.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:P.redLt,border:`1px solid ${P.redBd}`,borderRadius:14,padding:"32px",maxWidth:480,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12}}>🔒</div>
        <div style={{fontSize:17,fontWeight:800,color:P.red,marginBottom:8}}>Not Authorized</div>
        <div style={{fontSize:13,color:"#991B1B",marginBottom:20}}>
          Your email is verified but you do not have upload rights. Ask the administrator to add you in the admin portal.
        </div>
        <Btn color="red" outline onClick={signOut}>Sign out</Btn>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:P.bg}}>
      <div style={{background:P.ink,padding:"0 28px",position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:54}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:30,height:30,background:P.blue,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:"#fff"}}>N</div>
            <span style={{fontWeight:800,color:"#F8FAFC",fontSize:14}}>NCLS & Associates</span>
            <span style={{color:"#374151"}}>·</span>
            <span style={{fontSize:13,color:"#9CA3AF"}}>Staff Portal</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:12,color:"#6B7280"}}>{user.name} · {user.role}</span>
            <button onClick={signOut} style={{background:"#1C2333",color:"#9CA3AF",border:"1px solid #2D3748",borderRadius:7,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Sign out</button>
          </div>
        </div>
      </div>
      <div style={{maxWidth:1200,margin:"0 auto",padding:"28px"}}>
        <div style={{marginBottom:22}}>
          <h1 style={{fontSize:22,fontWeight:900,color:P.slate,marginBottom:4}}>Upload Audit Report</h1>
          <p style={{fontSize:13,color:P.muted}}>Select the report, upload the JSON and files, validate, then submit for approval.</p>
        </div>
        <UploadForm user={user} clients={clients} assignments={assignments} units={units}
          onUploaded={()=>loadData(user)} showToast={showToast}/>
        <MyUploads reports={myReports}/>
      </div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
<script>
  window.addEventListener('error', function(e) {
    const r = document.getElementById('root');
    if (r && !r.hasChildNodes())
      r.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#DC2626;background:#FEF2F2;border-radius:12px;margin:40px auto;max-width:500px;border:1px solid #FECACA"><h2>Portal failed to load</h2><p>' + (e.message||'Unknown error') + '</p></div>';
  });
  const src = document.getElementById('app-source').textContent;
  const out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  const s = document.createElement('script'); s.textContent = out; document.body.appendChild(s);
</script>
</body>
</html>
