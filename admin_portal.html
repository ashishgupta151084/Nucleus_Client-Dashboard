const MAPS = {
  clients:      { ClientName:"client_name", ClientType:"client_type", Code:"code", Status:"status", Notes:"notes" },
  assignments:  { ClientName:"client_name", AssignmentType:"assignment_type", Code:"code", Details:"details", FY:"fy", PeriodFrom:"period_from", PeriodTo:"period_to", Status:"status" },
  units:        { ClientName:"client_name", UnitName:"unit_name", Code:"code", AssignmentId:"assignment_id", Frequency:"frequency", Status:"status" },

  client_access:{ ClientName:"client_name", Email:"email", Name:"name", Designation:"designation", AccessLevel:"access_level", UnitId:"unit_id", ReportId:"report_id", Status:"status", AddedBy:"added_by" },
  reports:      { ClientName:"client_name", UnitId:"unit_id", UnitName:"unit_name", AssignmentId:"assignment_id", FY:"fy", Status:"status", UploadedBy:"uploaded_by", Period:"period", UDIN:"udin", AdditionalEmails:"additional_emails", ReportFile:"report_file", AnnexureFile:"annexure_file", ApprovedBy:"approved_by", ApprovedOn:"approved_on" },
};

function toUi(table, row) {
  const out = { id: row.id };
  for (const [ui, db] of Object.entries(MAPS[table])) out[ui] = row[db] ?? (Array.isArray(row[db]) ? [] : "");
  return out;
}
function toDb(table, obj) {
  const out = {};
  for (const [ui, db] of Object.entries(MAPS[table])) if (obj[ui] !== undefined) out[db] = obj[ui] === "" ? null : obj[ui];
  return out;
}
async function dbList(table) {
  const { data, error } = await sb.from(table).select("*").order("id");
  if (error) throw new Error(error.message);
  return data.map(r => toUi(table, r));
}
async function dbInsert(table, obj) {
  const { error } = await sb.from(table).insert(toDb(table, obj));
  if (error) throw new Error(error.message);
}
async function dbUpdate(table, id, obj) {
  const { error } = await sb.from(table).update(toDb(table, obj)).eq("id", id);
  if (error) throw new Error(error.message);
}
async function dbDelete(table, id) {
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) throw new Error(error.message);
}
async function logAction(action, by, details, section) {
  try { await sb.from("audit_trail").insert({ action, performed_by: by, details, section }); } catch {}
}

function readableError(err) {
  const raw = (err && (err.message || err.error_description || err.msg)) || "";
  const status = err && err.status;
  if (status === 429 || /rate limit|too many/i.test(raw)) return "Too many attempts. Please wait a minute and try again.";
  if (status === 500 || /unexpected_failure/i.test(raw)) return "Email could not be sent (server error). Check SMTP settings in Supabase.";
  if (/expired|invalid/i.test(raw)) return "That code is invalid or expired. Request a new one.";
  return raw || "Something went wrong. Please try again.";
}

// ── OTP LOGIN ─────────────────────────────────────────────────────────────
function LoginScreen({ onDone }) {
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [step, setStep] = useState("email");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const sendCode = async () => {
    setError("");
    const em = email.trim().toLowerCase();
    if (!em.includes("@")) { setError("Enter a valid email address."); return; }
    setBusy(true);
    const { error: err } = await sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: true } });
    setBusy(false);
    if (err) { setError(readableError(err)); return; }
    setStep("code");
  };

  const verify = async () => {
    setError("");
    if (code.trim().length < 6) { setError("Enter the code from your email."); return; }
    setBusy(true);
    const { error: err } = await sb.auth.verifyOtp({ email: email.trim().toLowerCase(), token: code.trim(), type: "email" });
    setBusy(false);
    if (err) { setError(readableError(err)); return; }
    onDone();
  };

  return (
    <div style={{ minHeight:"100vh", background:P.ink, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:420 }}>
        <div style={{ textAlign:"center", marginBottom:36 }}>

            <div style={{ textAlign:"left" }}>
              <div style={{ fontWeight:800, color:"#F8FAFC", fontSize:16 }}>NCLS & Associates</div>
              <div style={{ fontSize:11, color:P.muted }}>Chartered Accountants</div>
            </div>
          </div>
          <div style={{ fontSize:22, fontWeight:800, color:"#F8FAFC", marginBottom:6 }}>Admin Portal</div>
          <div style={{ fontSize:13, color:P.muted }}>Sign in with your email — a one-time code will be sent to you</div>
        </div>
        <div style={{ background:"#1C2333", borderRadius:16, padding:"32px 28px", border:"1px solid #2D3748" }}>
          {step === "email" ? (
            <>
              <label style={{ fontSize:11, fontWeight:700, color:P.muted, letterSpacing:.5, display:"block", marginBottom:6 }}>EMAIL ADDRESS</label>
              <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendCode()}

                style={{ width:"100%", background:"#0D1117", border:`1px solid ${error?"#EF4444":"#2D3748"}`, borderRadius:8, padding:"11px 14px", color:"#F8FAFC", fontSize:14, outline:"none", marginBottom:8 }} />
              {error&&<div style={{ fontSize:12, color:"#EF4444", marginBottom:8 }}>{error}</div>}
              <button onClick={sendCode} disabled={busy}
                style={{ width:"100%", background:busy?"#374151":P.blue, color:"#fff", border:"none", borderRadius:8, padding:"12px 0", fontWeight:700, fontSize:14, marginTop:6, cursor:"pointer" }}>
                {busy?"Sending code...":"Send One-Time Code →"}
              </button>
            </>
          ) : (
            <>
              <div style={{ fontSize:13, color:P.muted, marginBottom:18 }}>Code sent to <strong style={{ color:"#93C5FD" }}>{email}</strong>. Check your inbox (and spam).</div>
              <label style={{ fontSize:11, fontWeight:700, color:P.muted, letterSpacing:.5, display:"block", marginBottom:6 }}>SIGN-IN CODE</label>
              <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,"").slice(0,8))} onKeyDown={e=>e.key==="Enter"&&verify()}

function ClientsSection({ user, clients, assignments, units, reports, access, reload, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [saving, setSaving] = useState(false);
  const [deleteItem, setDeleteItem] = useState(null);
  const emptyForm = { ClientName:"",ClientType:"",Code:"",Status:"Active",Notes:"" };
  const [form, setForm] = useState(emptyForm);

  const save = async () => {
    if (saving) return;
    if (!form.ClientName||!form.ClientType) { showToast("Client name and type required","error"); return; }
    const dup = clients.find(c => c.ClientName.trim().toLowerCase()===form.ClientName.trim().toLowerCase() && c.id!==editItem?.id);
    if (dup) { showToast(`A client named "${dup.ClientName}" already exists`,"error"); return; }
    setSaving(true);
    try {
      if (editItem) { await dbUpdate("clients", editItem.id, form); await logAction("Updated client", user.email, form.ClientName, "Clients"); showToast("Client updated"); }
      else { await dbInsert("clients", form); await logAction("Added client", user.email, form.ClientName, "Clients"); showToast("Client added"); }
      setShowAdd(false); setEditItem(null); setForm(emptyForm);
      reload();
    } catch(e) { showToast(e.message,"error"); }
    setSaving(false);
  };
  const toggleStatus = async c => {
    const ns = c.Status==="Active"?"Inactive":"Active";
    try { await dbUpdate("clients", c.id, { Status: ns }); await logAction(`${ns} client`, user.email, c.ClientName, "Clients"); showToast(`Client ${ns.toLowerCase()}`); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };
  const dependents = c => ({
    units: units.filter(u=>u.ClientName===c.ClientName).length,
    assignments: assignments.filter(a=>a.ClientName===c.ClientName).length,
    reports: reports.filter(r=>r.ClientName===c.ClientName).length,
    access: access.filter(a=>a.ClientName===c.ClientName).length,
  });
  const doDelete = async c => {
    try { await dbDelete("clients", c.id); await logAction("Deleted client", user.email, c.ClientName, "Clients"); showToast("Client deleted"); setDeleteItem(null); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };

  return (
    <Card title="Clients" subtitle={`${clients.length} clients`}
      action={<Btn onClick={()=>{setShowAdd(true);setEditItem(null);setForm(emptyForm);}}>+ Add Client</Btn>}>
      <div style={{background:P.blueLt,border:`1px solid ${P.blueBd}`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:P.blue}}>
        ℹ️ A new client won't appear in a staff member's Upload dropdown until you also assign that client to them in the <strong>Staff & Roles</strong> tab. Super Admin sees everything automatically.
      </div>
      <table style={{ width:"100%",borderCollapse:"collapse",fontSize:13 }}>
        <thead><tr><TH center>S.No</TH><TH>Code</TH><TH>Client Name</TH><TH>Type</TH><TH>Status</TH><TH>Notes</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {clients.map((c,i)=>(
            <tr key={c.id} style={{ borderBottom:`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA" }}>
              <TD center muted small>{i+1}</TD>
              <TD muted small>{c.Code||"—"}</TD>
              <TD bold>{c.ClientName}</TD><TD>{c.ClientType}</TD>
              <td style={{padding:"10px 12px"}}><StatusBadge status={c.Status||"Active"}/></td>
              <TD muted small>{c.Notes}</TD>
              <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:6}}>
                <Btn size="sm" color="gray" onClick={()=>{setEditItem(c);setForm({ClientName:c.ClientName,ClientType:c.ClientType,Code:c.Code||"",Status:c.Status,Notes:c.Notes||""});setShowAdd(true);}}>Edit</Btn>
                <Btn size="sm" color={c.Status==="Active"?"red":"green"} outline onClick={()=>toggleStatus(c)}>
                  {c.Status==="Active"?"Deactivate":"Activate"}</Btn>
                <Btn size="sm" color="red" outline onClick={()=>setDeleteItem(c)}>Delete</Btn>
              </div></td>
            </tr>
          ))}
          {!clients.length&&<tr><td colSpan={7} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No clients yet. Add your first client.</td></tr>}
        </tbody>
      </table>
      {showAdd&&(
        <Modal title={editItem?"Edit Client":"Add Client"} onClose={()=>{setShowAdd(false);setEditItem(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Inp label="CLIENT NAME" value={form.ClientName} onChange={v=>setForm(f=>({...f,ClientName:v}))} placeholder="e.g. SI Interpack Private Limited" required/>
            <Inp label="CLIENT CODE (optional)" value={form.Code} onChange={v=>setForm(f=>({...f,Code:v}))} placeholder="e.g. SIIPL" hint="Short reference code for internal use"/>
            <Sel label="CLIENT TYPE" value={form.ClientType} onChange={v=>setForm(f=>({...f,ClientType:v}))} options={CLIENT_TYPES} required placeholder="Select type..."/>
            <Sel label="STATUS" value={form.Status} onChange={v=>setForm(f=>({...f,Status:v}))} options={["Active","Inactive"]}/>
            <Inp label="NOTES" value={form.Notes} onChange={v=>setForm(f=>({...f,Notes:v}))} placeholder="Optional notes"/>
            <div style={{display:"flex",gap:10,marginTop:6}}>
              <Btn onClick={save} full disabled={saving}>{saving?"Saving...":editItem?"Save Changes":"Add Client"}</Btn>
              <Btn color="gray" onClick={()=>{setShowAdd(false);setEditItem(null);}}>Cancel</Btn>
            </div>
          </div>
        </Modal>
      )}
      {deleteItem&&(() => {
        const dep = dependents(deleteItem);
        const blocked = dep.units+dep.assignments+dep.reports+dep.access > 0;
        return (
          <ConfirmModal title="Delete Client" onClose={()=>setDeleteItem(null)}
            blocked={blocked}
            message={blocked ? (
              <>Cannot delete <strong>{deleteItem.ClientName}</strong> — it still has
                {dep.units>0 && ` ${dep.units} unit${dep.units>1?"s":""}`}
                {dep.assignments>0 && `${dep.units>0?",":""} ${dep.assignments} assignment${dep.assignments>1?"s":""}`}
                {dep.reports>0 && `${(dep.units>0||dep.assignments>0)?",":""} ${dep.reports} report${dep.reports>1?"s":""}`}
                {dep.access>0 && `${(dep.units>0||dep.assignments>0||dep.reports>0)?",":""} ${dep.access} access record${dep.access>1?"s":""}`}
                . Remove those first, or Deactivate this client instead of deleting it.</>
            ) : (
              <>Delete <strong>{deleteItem.ClientName}</strong> permanently? This cannot be undone.</>
            )}
            onConfirm={()=>doDelete(deleteItem)}/>
        );
      })()}
    </Card>
  );
}

function UnitsSection({ user, clients, assignments, units, reports, access, reload, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [saving, setSaving] = useState(false);
  const [deleteItem, setDeleteItem] = useState(null);
  const [filterClient, setFilterClient] = useState("");
  const emptyForm = { ClientName:"",UnitName:"",Code:"",AssignmentId:"",Frequency:"",Status:"Active" };
  const [form, setForm] = useState(emptyForm);

  const clientAssignments = assignments.filter(a=>a.ClientName===form.ClientName&&a.Status==="Active");

  const save = async () => {
    if (saving) return;
    if (!form.ClientName||!form.UnitName||!form.AssignmentId||!form.Frequency) { showToast("All required fields missing","error"); return; }
    const dup = units.find(u => u.ClientName===form.ClientName && u.UnitName.trim().toLowerCase()===form.UnitName.trim().toLowerCase() && u.id!==editItem?.id);
    if (dup) { showToast(`"${form.UnitName}" already exists for this client`,"error"); return; }
    const payload = { ...form, AssignmentId: parseInt(form.AssignmentId) };
    setSaving(true);
    try {
      if (editItem) { await dbUpdate("units", editItem.id, payload); await logAction("Updated unit", user.email, `${form.ClientName} — ${form.UnitName}`, "Units"); showToast("Unit updated"); }
      else { await dbInsert("units", payload); await logAction("Added unit", user.email, `${form.ClientName} — ${form.UnitName}`, "Units"); showToast("Unit added"); }
      setShowAdd(false); setEditItem(null); setForm(emptyForm);
      reload();
    } catch(e) { showToast(e.message,"error"); }
    setSaving(false);
  };

  const filtered = filterClient ? units.filter(u=>u.ClientName===filterClient) : units;
  const getAssignment = id => assignments.find(a=>a.id===id);
  const dependents = u => {
    const unitReports = reports.filter(r=>r.UnitId===u.id);
    const reportIds = unitReports.map(r=>r.id);
    return {
      reports: unitReports.length,
      access: access.filter(a=>a.UnitId===u.id || (a.ReportId && reportIds.includes(a.ReportId))).length,
    };
  };
  const doDelete = async u => {
    try { await dbDelete("units", u.id); await logAction("Deleted unit", user.email, `${u.ClientName} — ${u.UnitName}`, "Units"); showToast("Unit deleted"); setDeleteItem(null); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };

  return (
    <Card title="Units" subtitle={`${units.length} units`}
      action={<Btn onClick={()=>{setShowAdd(true);setEditItem(null);setForm(emptyForm);}}>+ Add Unit</Btn>}>
      <div style={{marginBottom:14,maxWidth:300}}>
        <Sel value={filterClient} onChange={setFilterClient} options={clients.map(c=>c.ClientName)} placeholder="Filter by client..."/>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr><TH center>S.No</TH><TH>Code</TH><TH>Client</TH><TH>Unit</TH><TH>Assignment</TH><TH>Frequency</TH><TH>Status</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {filtered.map((u,i)=>{
            const asgn = getAssignment(u.AssignmentId);
            return (
              <tr key={u.id} style={{borderBottom:`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA"}}>
                <TD center muted small>{i+1}</TD>
                <TD muted small>{u.Code||"—"}</TD>
                <TD muted small>{u.ClientName}</TD>
                <TD bold>{u.UnitName}</TD>
                <td style={{padding:"10px 12px"}}>
                  {asgn&&<span style={{background:P.blueLt,color:P.blue,border:`1px solid ${P.blueBd}`,borderRadius:5,padding:"2px 8px",fontSize:11,fontWeight:700}}>{asgn.AssignmentType}</span>}
                </td>
                <TD small>{u.Frequency}</TD>
                <td style={{padding:"10px 12px"}}><StatusBadge status={u.Status||"Active"}/></td>
                <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:6}}>
                  <Btn size="sm" color="gray" onClick={()=>{setEditItem(u);setForm({ClientName:u.ClientName,UnitName:u.UnitName,Code:u.Code||"",AssignmentId:String(u.AssignmentId),Frequency:u.Frequency,Status:u.Status});setShowAdd(true);}}>Edit</Btn>
                  <Btn size="sm" color="red" outline onClick={()=>setDeleteItem(u)}>Delete</Btn>
                </div></td>
              </tr>
            );
          })}
          {!filtered.length&&<tr><td colSpan={8} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No units found.</td></tr>}
        </tbody>
      </table>
      {showAdd&&(
        <Modal title={editItem?"Edit Unit":"Add Unit"} onClose={()=>{setShowAdd(false);setEditItem(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Sel label="CLIENT" value={form.ClientName} onChange={v=>setForm(f=>({...f,ClientName:v,AssignmentId:""}))} options={clients.map(c=>c.ClientName)} required placeholder="Select client..."/>
            <Inp label="UNIT NAME" value={form.UnitName} onChange={v=>setForm(f=>({...f,UnitName:v}))} placeholder="e.g. Hinjewadi" required/>
            <Inp label="UNIT CODE (optional)" value={form.Code} onChange={v=>setForm(f=>({...f,Code:v}))} placeholder="e.g. SIIPL-HNJ"/>
            <Sel label="ASSIGNMENT" value={form.AssignmentId} onChange={v=>setForm(f=>({...f,AssignmentId:v}))} required placeholder="Select assignment..."
              hint="Assignment type is pulled from the Assignments tab"
              options={clientAssignments.map(a=>({ value:String(a.id), label:`${a.AssignmentType}${a.FY?" — FY "+a.FY:""}${a.Details?" ("+a.Details+")":""}` }))}/>
            <Sel label="FREQUENCY" value={form.Frequency} onChange={v=>setForm(f=>({...f,Frequency:v}))} options={FREQUENCIES} required placeholder="Select frequency..."/>
            <Sel label="STATUS" value={form.Status} onChange={v=>setForm(f=>({...f,Status:v}))} options={["Active","Inactive"]}/>
            <div style={{display:"flex",gap:10,marginTop:6}}>
              <Btn onClick={save} full disabled={saving}>{saving?"Saving...":editItem?"Save Changes":"Add Unit"}</Btn>
              <Btn color="gray" onClick={()=>{setShowAdd(false);setEditItem(null);}}>Cancel</Btn>
            </div>
          </div>
        </Modal>
      )}
      {deleteItem&&(() => {
        const dep = dependents(deleteItem);
        const blocked = dep.reports+dep.access > 0;
        return (
          <ConfirmModal title="Delete Unit" onClose={()=>setDeleteItem(null)}
            blocked={blocked}
            message={blocked ? (
              <>Cannot delete <strong>{deleteItem.UnitName}</strong> — it still has
                {dep.reports>0 && ` ${dep.reports} report${dep.reports>1?"s":""}`}
                {dep.access>0 && `${dep.reports>0?",":""} ${dep.access} access record${dep.access>1?"s":""}`}
                . Archive its reports and revoke access first, or Deactivate this unit instead.</>
            ) : (
              <>Delete <strong>{deleteItem.UnitName}</strong> permanently? This cannot be undone.</>
            )}
            onConfirm={()=>doDelete(deleteItem)}/>
        );
      })()}
    </Card>
  );
}

function UsersSection({ user, clients, assignments, units, users, reload, showToast }) {

  const [form, setForm] = useState({ Email:"",Name:"",Role:"Staff",AssignedClients:[],AssignedAssignments:[],AssignedUnits:[],Status:"Active",Permissions:defaultPerms("Staff") });

  const canManage = u => (ROLE_LEVEL[u.Role]||0) < (ROLE_LEVEL[user.role]||0);
  const assignableRoles = ROLES.filter(r=>ROLE_LEVEL[r]<(ROLE_LEVEL[user.role]||0));

  const clientOptions = clients.map(c=>({value:c.ClientName,label:c.ClientName}));
  const assignmentOptions = assignments.filter(a=>form.AssignedClients.includes(a.ClientName)&&a.Status==="Active")
    .map(a=>({value:a.id,label:`${a.ClientName} — ${a.AssignmentType}${a.FY?" FY"+a.FY:""}`,sub:a.Details||""}));
  const unitOptions = units.filter(u=>form.AssignedClients.includes(u.ClientName)&&u.Status!=="Inactive")
    .map(u=>({value:u.id,label:u.UnitName,sub:`(${u.ClientName})`}));

  const save = async () => {
    if (!form.Email||!form.Role) { showToast("Email and role required","error"); return; }
    if (!form.Email.includes("@")) { showToast("Invalid email","error"); return; }
    if (!assignableRoles.includes(form.Role)) { showToast("You cannot assign this role","error"); return; }
    const emailNorm = form.Email.trim().toLowerCase();
    const dup = users.find(u => u.Email.trim().toLowerCase()===emailNorm && u.id!==editItem?.id);
    if (dup) { showToast(`${emailNorm} is already added as a user`,"error"); return; }
    const custom = isCustom(form.Permissions, form.Role);
    const payload = { ...form, Email: emailNorm, AddedBy: user.email, Permissions: custom ? form.Permissions : null };
    try {
      if (editItem) { await dbUpdate("app_users", editItem.id, payload); await logAction("Updated user", user.email, `${payload.Email} — ${payload.Role}`, "Users"); showToast("User updated"); }
      else { await dbInsert("app_users", payload); await logAction("Added user", user.email, `${payload.Email} — ${payload.Role}`, "Users"); showToast("User added"); }
      setShowAdd(false); setEditItem(null); setForm({Email:"",Name:"",Role:"Staff",AssignedClients:[],AssignedAssignments:[],AssignedUnits:[],Status:"Active",Permissions:defaultPerms("Staff")});
      reload();
    } catch(e) { showToast(e.message,"error"); }
  };
  const toggleStatus = async u => {
    const ns = u.Status==="Active"?"Inactive":"Active";
    try { await dbUpdate("app_users", u.id, { Status: ns }); await logAction(`${ns==="Active"?"Restored":"Revoked"} user`, user.email, u.Email, "Users"); showToast(`User ${ns==="Active"?"restored":"revoked"}`); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };
  const doDelete = async u => {
    try { await dbDelete("app_users", u.id); await logAction("Deleted user", user.email, u.Email, "Users"); showToast("User deleted"); setDeleteItem(null); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };

  return (
    <Card title="Staff & Roles" subtitle={`${users.length} users`}
      action={<Btn onClick={()=>{setShowAdd(true);setEditItem(null);setForm({Email:"",Name:"",Role:"Staff",AssignedClients:[],AssignedAssignments:[],AssignedUnits:[],Status:"Active",Permissions:defaultPerms("Staff")});}}>+ Add User</Btn>}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr><TH center>S.No</TH><TH>Name / Email</TH><TH>Role</TH><TH>Assigned Clients</TH><TH>Assignments</TH><TH>Status</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {users.map((u,i)=>(
            <tr key={u.id} style={{borderBottom:`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA"}}>
              <TD center muted small>{i+1}</TD>
              <td style={{padding:"10px 12px"}}>
                <div style={{fontWeight:700,color:P.slate}}>{u.Name||"—"}</div>
                <div style={{fontSize:11,color:P.muted}}>{u.Email}</div>
              </td>
              <td style={{padding:"10px 12px"}}>
                <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                  <RoleBadge role={u.Role}/>
                  {u.Permissions && typeof u.Permissions==="object" &&
                    <span style={{background:P.amberLt,color:P.amber,border:`1px solid ${P.amberBd}`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700}}>CUSTOM</span>}
                </div>
              </td>
              <TD muted small>{u.AssignedClients?.length ? u.AssignedClients.join(", ") : "All clients"}</TD>
              <td style={{padding:"10px 12px",fontSize:11,color:P.muted}}>
                {u.AssignedAssignments?.length ? `${u.AssignedAssignments.length} assignment${u.AssignedAssignments.length>1?"s":""}` : "All"}
              </td>
              <td style={{padding:"10px 12px"}}><StatusBadge status={u.Status||"Active"}/></td>
              <td style={{padding:"10px 12px"}}>
                {canManage(u) ? (
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <Btn size="sm" color="gray" onClick={()=>{setEditItem(u);setForm({Email:u.Email,Name:u.Name||"",Role:u.Role,AssignedClients:u.AssignedClients||[],AssignedAssignments:u.AssignedAssignments||[],AssignedUnits:u.AssignedUnits||[],Status:u.Status,Permissions:effectivePerms(u)});setShowAdd(true);}}>Edit</Btn>
                    <Btn size="sm" color={u.Status==="Active"?"red":"green"} outline onClick={()=>toggleStatus(u)}>
                      {u.Status==="Active"?"Revoke":"Restore"}</Btn>
                    <Btn size="sm" color="red" outline onClick={()=>setDeleteItem(u)}>Delete</Btn>
                  </div>
                ) : (
                  <span style={{fontSize:11,color:P.muted}}>
                    {(ROLE_LEVEL[u.Role]||0) >= (ROLE_LEVEL[user.role]||0) ? "Requires a higher role to manage" : ""}
                  </span>
                )}
              </td>
            </tr>
          ))}
          {!users.length&&<tr><td colSpan={7} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No users yet.</td></tr>}
        </tbody>
      </table>

      <div style={{marginTop:20,padding:"16px",background:"#F8FAFC",borderRadius:10,border:`1px solid ${P.border}`}}>
        <div style={{fontSize:12,fontWeight:700,color:P.muted,marginBottom:10,letterSpacing:.5}}>ROLE HIERARCHY & RIGHTS</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
          {[
            {role:"Staff",rights:"Upload reports for assigned clients/units/assignments only"},
            {role:"Team Leader",rights:"Upload for any client. Review uploads. Cannot manage users."},
            {role:"Partner",rights:"Everything TL + add clients, units, assignments, staff emails"},
            {role:"Senior Partner",rights:"Everything Partner + add/remove Partners and TLs"},
            {role:"Admin",rights:"Full access. Manage all roles except Super Admin"},
          ].map(r=>(
            <div key={r.role} style={{background:P.white,borderRadius:8,padding:"10px 12px",border:`1px solid ${P.border}`}}>
              <div style={{marginBottom:5}}><RoleBadge role={r.role}/></div>
              <div style={{fontSize:11,color:P.muted,lineHeight:1.5}}>{r.rights}</div>
            </div>
          ))}
        </div>
      </div>

      {showAdd&&(
        <Modal title={editItem?"Edit User":"Add User"} wide onClose={()=>{setShowAdd(false);setEditItem(null);}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <Inp label="EMAIL" value={form.Email} onChange={v=>setForm(f=>({...f,Email:v}))} placeholder="staff@ncls.in" required type="email"/>
              <Inp label="FULL NAME" value={form.Name} onChange={v=>setForm(f=>({...f,Name:v}))} placeholder="e.g. Muskan Bansal"/>
              <Sel label="ROLE" value={form.Role} onChange={v=>setForm(f=>({...f,Role:v,Permissions:defaultPerms(v)}))} options={assignableRoles} required placeholder="Select role..."/>
              <Sel label="STATUS" value={form.Status} onChange={v=>setForm(f=>({...f,Status:v}))} options={["Active","Inactive"]}/>
              <div style={{background:P.amberLt,borderRadius:8,padding:"10px 12px",fontSize:11,color:P.amber}}>
                Leave clients/assignments/units blank to grant access to everything.
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <CheckPicker label="ASSIGNED CLIENTS" options={clientOptions} selected={form.AssignedClients}
                onChange={v=>setForm(f=>({...f,AssignedClients:v,AssignedAssignments:[],AssignedUnits:[]}))}
                hint="Select clients this user can access"/>
              <CheckPicker label="ASSIGNED ASSIGNMENTS" options={assignmentOptions} selected={form.AssignedAssignments}
                onChange={v=>setForm(f=>({...f,AssignedAssignments:v}))}
                hint="Filtered by selected clients"/>
              <CheckPicker label="ASSIGNED UNITS" options={unitOptions} selected={form.AssignedUnits}
                onChange={v=>setForm(f=>({...f,AssignedUnits:v}))}
                hint="Filtered by selected clients"/>
            </div>
          </div>

          {/* Permissions */}
          <div style={{marginTop:18,paddingTop:16,borderTop:`1px solid ${P.border}`}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              <label style={{fontSize:11,fontWeight:700,color:P.muted,letterSpacing:.5}}>PERMISSIONS</label>
              {isCustom(form.Permissions, form.Role)
                ? <span style={{background:P.amberLt,color:P.amber,border:`1px solid ${P.amberBd}`,borderRadius:4,padding:"1px 7px",fontSize:10,fontWeight:700}}>CUSTOM</span>
                : <span style={{background:"#F1F5F9",color:P.muted,border:`1px solid ${P.border}`,borderRadius:4,padding:"1px 7px",fontSize:10,fontWeight:700}}>ROLE DEFAULT</span>}
              {isCustom(form.Permissions, form.Role) &&
                <span onClick={()=>setForm(f=>({...f,Permissions:defaultPerms(f.Role)}))}
                  style={{fontSize:11,color:P.blue,cursor:"pointer",marginLeft:"auto",fontWeight:600}}>Reset to role default</span>}
            </div>
            <div style={{fontSize:11,color:P.muted,marginBottom:8}}>Ticked automatically from the role — change any box to grant or remove a right for this person only.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {PERMISSIONS.map(perm=>{
                const on = !!form.Permissions[perm.key];
                const diff = on !== !!defaultPerms(form.Role)[perm.key];
                return (
                  <div key={perm.key} onClick={()=>setForm(f=>({...f,Permissions:{...f.Permissions,[perm.key]:!f.Permissions[perm.key]}}))}
                    style={{display:"flex",alignItems:"center",gap:9,padding:"8px 11px",cursor:"pointer",
                      border:`1px solid ${diff?P.amberBd:P.border}`,borderRadius:8,background:on?(diff?P.amberLt:P.blueLt):P.white}}>
                    <div style={{width:16,height:16,borderRadius:4,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
                      border:`2px solid ${on?(diff?P.amber:P.blue):P.border}`,background:on?(diff?P.amber:P.blue):"#fff"}}>
                      {on&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,color:P.slate}}>{perm.label}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div style={{display:"flex",gap:10,marginTop:20}}>
            <Btn onClick={save} full>{editItem?"Save Changes":"Add User"}</Btn>
            <Btn color="gray" onClick={()=>{setShowAdd(false);setEditItem(null);}}>Cancel</Btn>
          </div>
        </Modal>
      )}
      {deleteItem&&(
        <ConfirmModal title="Delete User" onClose={()=>setDeleteItem(null)}
          message={<>Delete <strong>{deleteItem.Name||deleteItem.Email}</strong> ({deleteItem.Role}) permanently? They will immediately lose access to the staff portal. Use Revoke instead if you just want to disable their login while keeping the record.</>}
          onConfirm={()=>doDelete(deleteItem)}/>
      )}
    </Card>
  );
}

function buildAccessEmail(a, unitName, reportLabel) {
  const scopeLine = a.AccessLevel==="MD"
    ? `you will be able to view reports for all units of ${a.ClientName}.`
    : a.AccessLevel==="Unit Head"
    ? `you will be able to view reports for the ${unitName} unit of ${a.ClientName}.`
    : `you will be able to view the ${reportLabel} report of ${a.ClientName}.`;
  const subject = `Access to your ${a.ClientName} Internal Audit Dashboard`;
  const body =
`Dear ${a.Name||"Sir/Madam"},

You have been granted access to the NCLS & Associates internal audit dashboard for ${a.ClientName}. As ${a.Designation||"an authorised viewer"}, ${scopeLine}

To log in:
1. Visit: ${CLIENT_DASHBOARD_URL}
2. Enter your email address: ${a.Email}
3. You will receive a one-time login code by email — enter it on the same page to sign in.

No password is needed, and the code is required each time you sign in for security.

If you have any trouble logging in, please write to us at ${FIRM_EMAIL}.

Regards,
NCLS & Associates
Chartered Accountants`;
  return { subject, body };
}

function EmailDraftModal({ access: a, unitName, reportLabel, onClose, showToast }) {
  const { subject, body } = buildAccessEmail(a, unitName, reportLabel);
  const [copied, setCopied] = useState(false);
  const copyBody = async () => {
    try { await navigator.clipboard.writeText(body); setCopied(true); setTimeout(()=>setCopied(false),2500); }
    catch(e) { showToast("Could not copy — select and copy manually","error"); }
  };
  const mailtoHref = `mailto:${encodeURIComponent(a.Email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  return (
    <Modal title="Access Notification Email" onClose={onClose} wide>
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        <div>
          <div style={{ fontSize:10, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:4 }}>TO</div>
          <div style={{ fontSize:13, color:P.slate, fontWeight:600 }}>{a.Email}</div>
        </div>
        <div>
          <div style={{ fontSize:10, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:4 }}>SUBJECT</div>
          <div style={{ fontSize:13, color:P.slate, fontWeight:600 }}>{subject}</div>
        </div>
        <div>
          <div style={{ fontSize:10, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:4 }}>BODY</div>
          <div style={{ background:"#F8FAFC", border:`1px solid ${P.border}`, borderRadius:8, padding:"14px", fontSize:12.5, color:P.mid, lineHeight:1.6, whiteSpace:"pre-wrap" }}>{body}</div>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <a href={mailtoHref} style={{ flex:1, textAlign:"center", background:P.blue, color:"#fff", borderRadius:9, padding:"11px 0", fontWeight:700, fontSize:13, textDecoration:"none" }}>
            ✉️ Open in Email App
          </a>
          <Btn color="gray" onClick={copyBody}>{copied?"✓ Copied":"Copy Text"}</Btn>
        </div>
        <div style={{ fontSize:11, color:P.muted }}>Opens in your default email app with the recipient, subject and body pre-filled — review before sending.</div>
      </div>
    </Modal>
  );
}

function ClientAccessSection({ user, clients, units, reports, access, reload, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [saving, setSaving] = useState(false);
  const [filterClient, setFilterClient] = useState("");
  const [deleteItem, setDeleteItem] = useState(null);
  const [emailItem, setEmailItem] = useState(null);
  const emptyForm = { ClientName:"",Email:"",Name:"",Designation:"",AccessLevel:"MD",UnitId:"",ReportId:"",Status:"Active" };
  const [form, setForm] = useState(emptyForm);

  const filteredUnits = units.filter(u=>u.ClientName===form.ClientName);
  const filteredReports = reports.filter(r=>r.ClientName===form.ClientName&&(form.UnitId?r.UnitId===parseInt(form.UnitId):true));
  const filteredAccess = filterClient ? access.filter(a=>a.ClientName===filterClient) : access;

  const getUnitName = id => units.find(u=>u.id===id)?.UnitName||"—";
  const getReportLabel = id => { const r=reports.find(x=>x.id===id); return r?`${r.UnitName} FY${r.FY}`:"—"; };

  const save = async () => {
    if (saving) return;
    if (!form.ClientName||!form.Email||!form.AccessLevel) { showToast("Client, email and access level required","error"); return; }
    if (form.AccessLevel==="Unit Head"&&!form.UnitId) { showToast("Select a unit for Unit Head access","error"); return; }
    if (form.AccessLevel==="Specific Report"&&!form.ReportId) { showToast("Select a report for Specific Report access","error"); return; }
    const emailNorm = form.Email.trim().toLowerCase();
    const dup = access.find(a => a.ClientName===form.ClientName && a.Email.trim().toLowerCase()===emailNorm && a.Status==="Active");
    if (dup) { showToast(`${emailNorm} already has active access to ${form.ClientName}`,"error"); return; }
    const payload = { ...form, Email: emailNorm,
      UnitId: form.UnitId?parseInt(form.UnitId):null, ReportId: form.ReportId?parseInt(form.ReportId):null, AddedBy: user.email };
    setSaving(true);
    try {
      await dbInsert("client_access", payload);
      await logAction("Granted client access", user.email, `${payload.Email} → ${payload.ClientName} (${payload.AccessLevel})`, "ClientAccess");
      showToast("Access granted");
      setShowAdd(false); setForm(emptyForm);
      reload();
    } catch(e) { showToast(e.message,"error"); }
    setSaving(false);
  };
  const revoke = async a => {
    try { await dbUpdate("client_access", a.id, { Status:"Inactive" }); await logAction("Revoked client access", user.email, `${a.Email} → ${a.ClientName}`, "ClientAccess"); showToast("Access revoked"); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };
  const doDelete = async a => {
    try { await dbDelete("client_access", a.id); await logAction("Deleted client access", user.email, `${a.Email} → ${a.ClientName}`, "ClientAccess"); showToast("Access record deleted"); setDeleteItem(null); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };

  return (
    <Card title="Client & Management Access" subtitle="Control who can view the client-facing dashboard"
      action={<Btn onClick={()=>setShowAdd(true)}>+ Grant Access</Btn>}>
      <div style={{marginBottom:14,maxWidth:300}}>
        <Sel value={filterClient} onChange={setFilterClient} options={clients.map(c=>c.ClientName)} placeholder="Filter by client..."/>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {level:"MD",desc:"All reports for the entire company",col:P.purple,bg:P.purpleLt,border:P.purpleBd},
          {level:"Unit Head",desc:"All reports for a specific unit",col:P.blue,bg:P.blueLt,border:P.blueBd},
          {level:"Specific Report",desc:"One particular report only",col:P.amber,bg:P.amberLt,border:P.amberBd},
        ].map(l=>(
          <div key={l.level} style={{background:l.bg,border:`1px solid ${l.border}`,borderRadius:8,padding:"8px 12px",flex:1,minWidth:160}}>
            <span style={{background:l.bg,color:l.col,border:`1px solid ${l.border}`,borderRadius:4,padding:"1px 8px",fontSize:11,fontWeight:700}}>{l.level}</span>
            <div style={{fontSize:11,color:l.col,marginTop:5}}>{l.desc}</div>
          </div>
        ))}
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr><TH center>S.No</TH><TH>Name / Email</TH><TH>Designation</TH><TH>Client</TH><TH>Access Level</TH><TH>Scope</TH><TH>Status</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {filteredAccess.map((a,i)=>(
            <tr key={a.id} style={{borderBottom:`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA"}}>
              <TD center muted small>{i+1}</TD>
              <td style={{padding:"10px 12px"}}>
                <div style={{fontWeight:700,color:P.slate}}>{a.Name||"—"}</div>
                <div style={{fontSize:11,color:P.muted}}>{a.Email}</div>
              </td>
              <TD muted small>{a.Designation||"—"}</TD>
              <TD muted small>{a.ClientName}</TD>
              <td style={{padding:"10px 12px"}}>
                <span style={{
                  background:a.AccessLevel==="MD"?P.purpleLt:a.AccessLevel==="Unit Head"?P.blueLt:P.amberLt,
                  color:a.AccessLevel==="MD"?P.purple:a.AccessLevel==="Unit Head"?P.blue:P.amber,
                  border:`1px solid ${a.AccessLevel==="MD"?P.purpleBd:a.AccessLevel==="Unit Head"?P.blueBd:P.amberBd}`,
                  borderRadius:5,padding:"2px 9px",fontSize:11,fontWeight:700
                }}>{a.AccessLevel}</span>
              </td>
              <TD muted small>
                {a.AccessLevel==="MD"?"All units & reports":
                 a.AccessLevel==="Unit Head"?`Unit: ${getUnitName(a.UnitId)}`:
                 `Report: ${getReportLabel(a.ReportId)}`}
              </TD>
              <td style={{padding:"10px 12px"}}><StatusBadge status={a.Status||"Active"}/></td>
              <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <Btn size="sm" color="blue" outline onClick={()=>setEmailItem(a)}>✉️ Email</Btn>
                {a.Status==="Active"&&<Btn size="sm" color="red" outline onClick={()=>revoke(a)}>Revoke</Btn>}
                <Btn size="sm" color="red" outline onClick={()=>setDeleteItem(a)}>Delete</Btn>
              </div></td>
            </tr>
          ))}
          {!filteredAccess.length&&<tr><td colSpan={8} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No access records found.</td></tr>}
        </tbody>
      </table>
      {showAdd&&(
        <Modal title="Grant Dashboard Access" wide onClose={()=>setShowAdd(false)}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Inp label="FULL NAME" value={form.Name} onChange={v=>setForm(f=>({...f,Name:v}))} placeholder="e.g. Rajesh Sharma"/>
              <Inp label="DESIGNATION" value={form.Designation} onChange={v=>setForm(f=>({...f,Designation:v}))} placeholder="e.g. Managing Director"/>
            </div>
            <Inp label="EMAIL ADDRESS" value={form.Email} onChange={v=>setForm(f=>({...f,Email:v}))} placeholder="md@client.com" required type="email"
              hint="This person receives an OTP to log in to the client dashboard"/>
            <Sel label="CLIENT" value={form.ClientName} onChange={v=>setForm(f=>({...f,ClientName:v,UnitId:"",ReportId:""}))} options={clients.map(c=>c.ClientName)} required placeholder="Select client..."/>
            <Sel label="ACCESS LEVEL" value={form.AccessLevel} onChange={v=>setForm(f=>({...f,AccessLevel:v,UnitId:"",ReportId:""}))} options={["MD","Unit Head","Specific Report"]} required/>
            {form.AccessLevel==="MD"&&(
              <div style={{background:P.purpleLt,border:`1px solid ${P.purpleBd}`,borderRadius:8,padding:"10px 14px",fontSize:12,color:P.purple}}>
                <strong>MD access</strong> — this person will see all reports for all units of <strong>{form.ClientName||"the selected client"}</strong>.
              </div>
            )}
            {form.AccessLevel==="Unit Head"&&(
              <Sel label="UNIT" value={form.UnitId} onChange={v=>setForm(f=>({...f,UnitId:v,ReportId:""}))} required placeholder="Select unit..."
                hint="Unit Head sees all reports for this unit"
                options={filteredUnits.map(u=>({value:String(u.id),label:u.UnitName}))}/>
            )}
            {form.AccessLevel==="Specific Report"&&(
              <>
                <Sel label="UNIT" value={form.UnitId} onChange={v=>setForm(f=>({...f,UnitId:v,ReportId:""}))} placeholder="Filter by unit (optional)"
                  options={filteredUnits.map(u=>({value:String(u.id),label:u.UnitName}))}/>
                <Sel label="REPORT" value={form.ReportId} onChange={v=>setForm(f=>({...f,ReportId:v}))} required placeholder="Select report..."
                  hint="This person will see only this one report"
                  options={filteredReports.map(r=>({value:String(r.id),label:`${r.UnitName} — FY ${r.FY} (${r.Status})`}))}/>
              </>
            )}
            <div style={{display:"flex",gap:10,marginTop:4}}>
              <Btn onClick={save} full disabled={saving}>{saving?"Saving...":"Grant Access"}</Btn>
              <Btn color="gray" onClick={()=>setShowAdd(false)}>Cancel</Btn>
            </div>
          </div>
        </Modal>
      )}
      {deleteItem&&(
        <ConfirmModal title="Delete Access Record" onClose={()=>setDeleteItem(null)}
          message={<>Delete the access record for <strong>{deleteItem.Email}</strong> ({deleteItem.ClientName})? This removes it entirely — use Revoke instead if you just want to disable login while keeping the record.</>}
          onConfirm={()=>doDelete(deleteItem)}/>
      )}
      {emailItem&&(
        <EmailDraftModal access={emailItem} unitName={getUnitName(emailItem.UnitId)} reportLabel={getReportLabel(emailItem.ReportId)}
          onClose={()=>setEmailItem(null)} showToast={showToast}/>
      )}
    </Card>
  );
}

const RISK = { Critical:"#DC2626", High:"#EA580C", Medium:"#D97706", Low:"#16A34A" };
const RISK_ORDER = ["Critical","High","Medium","Low"];
const ROOT_CAUSE_COLORS = [P.blue, P.purple, P.amber, "#0D9488", P.red, P.muted];

function RiskDonut({ risk, size=220 }) {
  const data = RISK_ORDER.map(k => ({ name:k, value: risk[k.toLowerCase()]||0 })).filter(d=>d.value>0);
  if (!data.length) return <div style={{ fontSize:12, color:P.muted, textAlign:"center", padding:"40px 0" }}>No risk data</div>;
  return (
    <ResponsiveContainer width="100%" height={size}>
      <PieChart>
        <Pie data={data} dataKey="value" nameKey="name" innerRadius="52%" outerRadius="82%" paddingAngle={2}>
          {data.map((d,i) => <Cell key={i} fill={RISK[d.name]} />)}
        </Pie>
        <Tooltip/>
        <Legend verticalAlign="bottom" height={30} iconType="circle" wrapperStyle={{fontSize:12}}/>
      </PieChart>
    </ResponsiveContainer>
  );
}

function RootCauseDonut({ rootCauseRollup, size=220 }) {
  if (!rootCauseRollup || !rootCauseRollup.length) return <div style={{ fontSize:12, color:P.muted, textAlign:"center", padding:"40px 0" }}>No root cause data</div>;
  return (
    <ResponsiveContainer width="100%" height={size}>
      <PieChart>
        <Pie data={rootCauseRollup} dataKey="value" nameKey="name" innerRadius="52%" outerRadius="82%" paddingAngle={2}>
          {rootCauseRollup.map((d,i) => <Cell key={i} fill={ROOT_CAUSE_COLORS[i % ROOT_CAUSE_COLORS.length]} />)}
        </Pie>
        <Tooltip/>
        <Legend verticalAlign="bottom" height={40} iconType="circle" wrapperStyle={{fontSize:11}}/>
      </PieChart>
    </ResponsiveContainer>
  );
}

function UnitBarChart({ units, size=280 }) {

// ── Build a consolidated (company-level) summary from a set of reports ────
function buildConsolidated(reports) {
  const totals = { critical:0, high:0, medium:0, low:0 };
  const units = [];
  const areaMap = {};
  const limitationsMap = {};
  const repeatedByUnit = {};
  const rootCauseMap = {};

  reports.forEach(r => {
    const j = r.report_json || {};
    const risk = j.audit_summary?.observation_count_by_risk || {};
    const c = risk.critical||0, h = risk.high||0, m = risk.medium||0, l = risk.low||0;
    totals.critical += c; totals.high += h; totals.medium += m; totals.low += l;

    let repeatedCount=0, newCount=0;
    (j.areas||[]).forEach(area=>{
      (area.observations||[]).forEach(obs=>{
        if (obs.is_repeated) repeatedCount++; else newCount++;
        const rc = obs.root_cause || "Not stated";
        rootCauseMap[rc] = (rootCauseMap[rc]||0) + 1;
      });
    });

    units.push({
      unitName: r.unit_name, fy: r.fy, rating: j.report_metadata?.overall_rating || "",
      critical:c, high:h, medium:m, low:l, total:c+h+m+l, status: r.status,
      repeatedCount, newCount,
    });

    if(!repeatedByUnit[r.unit_name]) repeatedByUnit[r.unit_name]=[];
    repeatedByUnit[r.unit_name].push({ fy:r.fy, repeated:repeatedCount, new:newCount, total:repeatedCount+newCount });

    (j.audit_summary?.area_wise_summary || []).forEach(row => {
      if (!areaMap[row.area]) areaMap[row.area] = { area:row.area, critical:0, high:0, medium:0, low:0, total:0, units:new Set() };
      const a = areaMap[row.area];
      a.critical += row.critical||0; a.high += row.high||0; a.medium += row.medium||0; a.low += row.low||0;
      a.total += row.total||0; a.units.add(r.unit_name);
    });

    (j.limitations||[]).forEach(lim=>{
      if(!lim.area || !(lim.items||[]).length) return;
      if(!limitationsMap[lim.area]) limitationsMap[lim.area]={area:lim.area, units:new Set(), itemsByUnit:{}};
      limitationsMap[lim.area].units.add(r.unit_name);
      limitationsMap[lim.area].itemsByUnit[r.unit_name] = lim.items;
    });
  });

  const areaRollup = Object.values(areaMap)
    .map(a => ({ ...a, unitCount: a.units.size }))
    .sort((a,b) => b.total - a.total);
  const limitationsRollup = Object.values(limitationsMap).map(l=>({...l,unitCount:l.units.size})).sort((a,b)=>b.unitCount-a.unitCount);
  Object.values(repeatedByUnit).forEach(arr=>arr.sort((a,b)=>String(a.fy).localeCompare(String(b.fy))));
  const repeatedTotals = units.reduce((acc,u)=>({repeated:acc.repeated+u.repeatedCount, new:acc.new+u.newCount}),{repeated:0,new:0});
  const rootCauseRollup = Object.entries(rootCauseMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);

  return {
    totals: { ...totals, total: totals.critical+totals.high+totals.medium+totals.low },
    units: units.sort((a,b) => b.total - a.total),
    areaRollup, limitationsRollup, repeatedByUnit, repeatedTotals, rootCauseRollup,
  };
}

              const rate = row.total ? Math.round(row.repeated/row.total*100) : 0;
              const prev = i>0 ? rows[i-1] : null;
              const trend = prev ? (row.repeated>prev.repeated?"up":row.repeated<prev.repeated?"down":"flat") : null;
              return (
                <tr key={unitName+row.fy} style={{ borderBottom:`1px solid ${P.border}` }}>
                  <td style={{ padding:"10px 12px", fontWeight:700, color:P.slate }}>{i===0?unitName:""}</td>
                  <td style={{ padding:"10px 12px", color:P.mid }}>{row.fy}</td>
                  <td style={{ padding:"10px 12px", textAlign:"center", fontWeight:700, color:P.amber }}>{row.repeated}</td>

                  </td>

                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

  useEffect(() => {

      try {

        if (error) throw new Error(error.message);
        setReport(data);
        setViewedReport(data);

          .eq("client_name", data.client_name).eq("status", "Live");

                ["Medium",risk.medium||0,RISK.Medium],["Low",risk.low||0,RISK.Low]].map(([l,v,c]) => (
                <div key={l} style={{ background:P.white, borderRadius:12, border:`1px solid ${P.border}`, padding:"18px" }}>
                  <div style={{ fontSize:11, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:6 }}>{l.toUpperCase()}</div>
                  <div style={{ fontSize:28, fontWeight:900, color:c }}>{v}</div>
                </div>
              ))}
            </div>

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:18 }}>
              <div style={{ background:P.white, borderRadius:14, border:`1px solid ${P.border}`, padding:"22px" }}>
                <div style={{ fontSize:15, fontWeight:800, color:P.slate, marginBottom:8 }}>Observations by Risk Level</div>
                <RiskDonut risk={risk}/>
              </div>
              <div style={{ background:P.white, borderRadius:14, border:`1px solid ${P.border}`, padding:"22px" }}>
                <div style={{ fontSize:15, fontWeight:800, color:P.slate, marginBottom:8 }}>Observations by Root Cause</div>
                <RootCauseDonut rootCauseRollup={rootCauseRollup}/>
              </div>
            </div>

            <div style={{ background:P.white, borderRadius:14, border:`1px solid ${P.border}`, padding:"22px" }}>
              <div style={{ fontSize:15, fontWeight:800, color:P.slate, marginBottom:6 }}>Area-wise Observations</div>
              <div style={{ fontSize:12, color:P.muted, marginBottom:16 }}>This is exactly what the client will see once published.</div>
              {(j.audit_summary?.area_wise_summary || []).map(row => {
                const isOpen = openArea === row.area;
                const area = (j.areas || []).find(a => a.area_name === row.area);
                return (
                  <div key={row.area} style={{ marginBottom:8, border:`1px solid ${isOpen?P.blueBd:P.border}`, borderRadius:10, overflow:"hidden" }}>
                    <div onClick={()=>{setOpenArea(isOpen?null:row.area);setOpenObs(null);}}
                      style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", cursor:"pointer", background:isOpen?P.blueLt:P.white }}>
                      <span style={{ fontSize:12, color:P.muted, transform:isOpen?"rotate(90deg)":"none" }}>▶</span>
                      <div style={{ flex:1, fontWeight:700, color:P.slate, fontSize:14 }}>{row.area}</div>
                      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                        {[["C",row.critical,RISK.Critical],["H",row.high,RISK.High],["M",row.medium,RISK.Medium],["L",row.low,RISK.Low]]
                          .map(([k,v,c]) => v>0 ? <span key={k} style={{ background:c, color:"#fff", borderRadius:5, padding:"2px 8px", fontSize:11, fontWeight:800 }}>{k} {v}</span> : null)}
                      </div>
                      <div style={{ fontSize:13, fontWeight:800, color:P.slate, minWidth:28, textAlign:"right" }}>{row.total}</div>
                    </div>
                    {isOpen && area && (
                      <div style={{ borderTop:`1px solid ${P.border}`, background:"#FBFCFE" }}>
                        {(area.observations || []).map((obs, oi) => (
                          <div key={oi}>
                            <div onClick={()=>setOpenObs(openObs===`${row.area}-${oi}`?null:`${row.area}-${oi}`)}
                              style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 16px 11px 42px", cursor:"pointer",
                                borderBottom:`1px solid ${P.border}`, background:openObs===`${row.area}-${oi}`?P.white:"transparent" }}>
                              <span style={{ width:8, height:8, borderRadius:"50%", background:RISK[obs.risk_level]||P.muted, flexShrink:0 }}/>
                              <div style={{ flex:1, fontSize:13, color:P.slate, fontWeight:600 }}>{obs.title}</div>
                              {obs.is_repeated && <span style={{ background:P.amberLt, color:P.amber, border:`1px solid ${P.amberBd}`, borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:800 }}>REPEATED</span>}
                              <span style={{ background:(RISK[obs.risk_level]||P.muted)+"18", color:RISK[obs.risk_level]||P.muted,
                                borderRadius:5, padding:"2px 9px", fontSize:11, fontWeight:700 }}>{obs.risk_level}</span>
                            </div>
                            {openObs===`${row.area}-${oi}` && (
                              <div style={{ padding:"16px 20px 20px 42px", background:P.white, borderBottom:`1px solid ${P.border}` }}>
                                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
                                  <div><div style={{ fontSize:10, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:3 }}>RESPONSIBLE</div>
                                    <div style={{ fontSize:13, color:P.slate, fontWeight:600 }}>{obs.responsible||"—"}</div></div>
                                  <div><div style={{ fontSize:10, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:3 }}>TARGET DATE</div>
                                    <div style={{ fontSize:13, color:P.slate, fontWeight:600 }}>{obs.target_date||"—"}</div></div>
                                </div>
                                {obs.is_repeated && <div style={{ background:P.amberLt, border:`1px solid ${P.amberBd}`, borderRadius:8, padding:"8px 12px", marginBottom:14, fontSize:12, color:P.amber }}>
                                  <strong>Repeated from a prior audit</strong>{obs.pending_since_days?` — pending ${obs.pending_since_days} days`:""}</div>}
                                {obs.observation && <div style={{ marginBottom:14 }}>
                                  <div style={{ fontSize:10, fontWeight:700, color:P.muted, letterSpacing:.5, marginBottom:4 }}>OBSERVATION</div>
                                  <div style={{ fontSize:13, color:P.mid, lineHeight:1.6 }}>{obs.observation}</div></div>}
                                {obs.action_plan && <div style={{ background:P.greenLt, border:`1px solid ${P.greenBd}`, borderRadius:8, padding:"12px 14px" }}>
                                  <div style={{ fontSize:10, fontWeight:700, color:P.green, letterSpacing:.5, marginBottom:4 }}>MANAGEMENT ACTION PLAN</div>
                                  <div style={{ fontSize:13, color:"#166534", lineHeight:1.6 }}>{obs.action_plan}</div></div>}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
              {!(j.audit_summary?.area_wise_summary || []).length && (
                <div style={{ padding:30, textAlign:"center", color:P.muted, fontSize:13 }}>No structured JSON data on this report.</div>
              )}
            </div>

            {(j.limitations||[]).length>0 && (
              <div style={{ background:P.white, borderRadius:14, border:`1px solid ${P.border}`, padding:"22px", marginTop:18 }}>
                <div style={{ fontSize:15, fontWeight:800, color:P.slate, marginBottom:6 }}>Scope Limitations</div>
                <div style={{ fontSize:12, color:P.muted, marginBottom:16 }}>Data not made available to the auditors during this engagement.</div>
                {j.limitations.map((lim,li) => (
                  <div key={li} style={{ marginBottom:12, paddingBottom:12, borderBottom:li<j.limitations.length-1?`1px solid ${P.border}`:"none" }}>
                    <div style={{ fontSize:13, fontWeight:700, color:P.slate, marginBottom:6 }}>{lim.area}</div>
                    <div style={{ fontSize:12, color:P.mid, paddingLeft:12 }}>
                      {(lim.items||[]).map((it,ii) => (<div key={ii} style={{ marginBottom:2 }}>• {it}</div>))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

async function downloadFile(path, showToast) {
  if (!path) return;
  try {
    const { data, error } = await sb.storage.from("reports").createSignedUrl(path, 120);
    if (error) throw new Error(error.message);
    window.open(data.signedUrl, "_blank");
  } catch(e) { showToast("Could not open file: "+e.message, "error"); }
}

function ReportsSection({ user, reports, reload, showToast }) {
  const [selected, setSelected] = useState(null);
  const [extraEmail, setExtraEmail] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [rejecting, setRejecting] = useState(null);
  const [reason, setReason] = useState("");
  const [previewId, setPreviewId] = useState(null);

  const canApprove = !!user.perms?.approve_reports;
  const mine = r => !user.clients?.length || user.clients.includes(r.ClientName);
  const pending = reports.filter(r => r.Status==="Draft");
  const pendingMine = pending.filter(mine);

  const setStatus = async (r, status, extra={}) => {
    try {
      await dbUpdate("reports", r.id, { Status: status, ...extra });
      await logAction(`Report ${status}`, user.email, `${r.ClientName} — ${r.UnitName} FY${r.FY}`, "Reports");
      showToast(`Report set to ${status}`); reload();
    } catch(e) { showToast(e.message,"error"); }
  };

  const approve = async r => {
    try {
      await sb.from("reports").update({ status:"Live", approved_by:user.email, approved_on:new Date().toISOString(), rejected_reason:null }).eq("id", r.id);
      await logAction("Approved & published report", user.email, `${r.ClientName} — ${r.UnitName} FY${r.FY}`, "Reports");
      showToast("Report approved and published"); reload();
    } catch(e) { showToast(e.message,"error"); }
  };

  const doReject = async () => {
    if (!reason.trim()) { showToast("Please give a reason","error"); return; }
    try {
      await sb.from("reports").update({ status:"Rejected", rejected_reason:reason.trim() }).eq("id", rejecting.id);
      await logAction("Rejected report", user.email, `${rejecting.ClientName} — ${rejecting.UnitName}: ${reason.trim()}`, "Reports");
      showToast("Report rejected — staff can re-upload"); setRejecting(null); setReason(""); reload();
    } catch(e) { showToast(e.message,"error"); }
  };

  const saveEmails = async (report, updated) => {
    try { await dbUpdate("reports", report.id, { AdditionalEmails: updated }); setSelected(s=>({...s,AdditionalEmails:updated})); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };
  const addEmail = async () => {
    if (!extraEmail||!extraEmail.includes("@")) { showToast("Valid email required","error"); return; }
    const curr = selected.AdditionalEmails ? selected.AdditionalEmails.split(",").map(e=>e.trim()).filter(Boolean) : [];
    if (curr.includes(extraEmail)) { showToast("Email already added","error"); return; }
    await saveEmails(selected, [...curr, extraEmail.trim().toLowerCase()].join(", "));
    await logAction("Added email to report", user.email, `${extraEmail} → ${selected.ClientName}/${selected.UnitName}`, "Reports");
    setExtraEmail(""); showToast("Email added");
  };
  const removeEmail = async email => {
    const updated = selected.AdditionalEmails.split(",").map(e=>e.trim()).filter(e=>e&&e!==email).join(", ");
    await saveEmails(selected, updated);
    await logAction("Removed email from report", user.email, `${email} from ${selected.ClientName}`, "Reports");
    showToast("Email removed");
  };

  const filtered = filterStatus ? reports.filter(r=>r.Status===filterStatus) : reports;

  return (
    <Card title="Reports" subtitle={`${reports.length} reports — uploaded via the staff portal`}>
      {/* Pending approval banner */}
      {pendingMine.length > 0 && (
        <div style={{background:P.amberLt,border:`1px solid ${P.amberBd}`,borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:18}}>⏳</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:800,color:P.amber}}>
              {pendingMine.length} report{pendingMine.length>1?"s":""} awaiting your approval
            </div>
            <div style={{fontSize:11,color:"#92400E",marginTop:2}}>
              {pendingMine.map(r=>`${r.ClientName} — ${r.UnitName}`).join(" · ")}
            </div>
          </div>
          <Btn size="sm" color="amber" onClick={()=>setFilterStatus("Draft")}>Review now</Btn>
        </div>
      )}

      <div style={{marginBottom:14,maxWidth:220}}>
        <Sel value={filterStatus} onChange={setFilterStatus} options={["Draft","Live","Rejected","Archived"]} placeholder="Filter by status..."/>
      </div>

      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr><TH>Client / Unit</TH><TH>FY</TH><TH>Status</TH><TH>Uploaded By</TH><TH>Files</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {filtered.map((r,i)=>{
            const awaiting = r.Status==="Draft" && mine(r);
            return (
            <tr key={r.id} style={{borderBottom:`1px solid ${P.border}`,background:awaiting?"#FFFDF5":(i%2===0?P.white:"#FAFAFA")}}>
              <td style={{padding:"10px 12px"}}>
                <div style={{fontWeight:700,color:P.slate,display:"flex",alignItems:"center",gap:6}}>
                  {r.ClientName}
                  {awaiting&&<span style={{background:P.amber,color:"#fff",borderRadius:4,padding:"1px 6px",fontSize:9,fontWeight:800}}>NEEDS APPROVAL</span>}
                </div>
                <div style={{fontSize:11,color:P.muted}}>{r.UnitName}</div>
              </td>
              <TD>{r.FY}</TD>
              <td style={{padding:"10px 12px"}}><StatusBadge status={r.Status||"Draft"}/></td>
              <TD muted small>{r.UploadedBy}</TD>
              <td style={{padding:"10px 12px"}}>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {r.ReportFile   && <Btn size="sm" color="gray" onClick={()=>downloadFile(r.ReportFile, showToast)}>Report</Btn>}
                  {r.AnnexureFile && <Btn size="sm" color="gray" onClick={()=>downloadFile(r.AnnexureFile, showToast)}>Annexure</Btn>}
                  {!r.ReportFile && <span style={{fontSize:11,color:P.muted}}>—</span>}
                </div>
              </td>
              <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {(r.Status==="Draft"||r.Status==="Rejected") && <Btn size="sm" color="blue" outline onClick={()=>setPreviewId(r.id)}>👁️ Preview</Btn>}
                {canApprove && r.Status==="Draft" && <Btn size="sm" color="green" onClick={()=>approve(r)}>Approve & Publish</Btn>}
                {canApprove && r.Status==="Draft" && <Btn size="sm" color="red" outline onClick={()=>{setRejecting(r);setReason("");}}>Reject</Btn>}
                {canApprove && r.Status==="Rejected" && <Btn size="sm" color="green" onClick={()=>approve(r)}>Approve anyway</Btn>}
                {canApprove && r.Status==="Live" && <Btn size="sm" color="amber" outline onClick={()=>setStatus(r,"Draft")}>Unpublish</Btn>}
                {!canApprove && r.Status==="Draft" && <span style={{fontSize:11,color:P.muted}}>Awaiting approver</span>}
                {r.Status!=="Archived" && <Btn size="sm" color="gray" onClick={()=>setStatus(r,"Archived")}>Archive</Btn>}
                <Btn size="sm" color="purple" outline onClick={()=>setSelected(r)}>Access</Btn>
              </div></td>
            </tr>);
          })}
          {!filtered.length&&<tr><td colSpan={6} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No reports yet. Reports appear here once staff upload them.</td></tr>}
        </tbody>
      </table>

      {rejecting&&(
        <Modal title={`Reject — ${rejecting.ClientName} / ${rejecting.UnitName}`} onClose={()=>setRejecting(null)}>
          <div style={{fontSize:12,color:P.muted,marginBottom:12}}>The uploader will see this reason and can correct and re-upload.</div>
          <TextArea label="REASON FOR REJECTION" value={reason} onChange={setReason} placeholder="e.g. Risk totals do not match the signed report" required/>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <Btn color="red" onClick={doReject} full>Reject Report</Btn>
            <Btn color="gray" onClick={()=>setRejecting(null)}>Cancel</Btn>
          </div>
        </Modal>
      )}

      {selected&&(
        <Modal title={`Report Access — ${selected.ClientName} / ${selected.UnitName}`} onClose={()=>setSelected(null)}>
          <div style={{fontSize:12,color:P.muted,marginBottom:14}}>Add or remove specific email access for this report.</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input value={extraEmail} onChange={e=>setExtraEmail(e.target.value)} placeholder="email@domain.com" onKeyDown={e=>e.key==="Enter"&&addEmail()}
              style={{flex:1,border:`1px solid ${P.border}`,borderRadius:7,padding:"8px 10px",fontSize:13,outline:"none"}}/>
            <Btn onClick={addEmail}>Add</Btn>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {selected.AdditionalEmails ? selected.AdditionalEmails.split(",").map(e=>e.trim()).filter(Boolean).map(email=>(
              <div key={email} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:P.blueLt,borderRadius:7,padding:"8px 12px"}}>
                <span style={{fontSize:13,color:P.blue,fontWeight:600}}>{email}</span>
                <Btn size="sm" color="red" outline onClick={()=>removeEmail(email)}>Remove</Btn>
              </div>
            )) : <div style={{fontSize:12,color:P.muted}}>No additional emails. Access inherited from client settings.</div>}
          </div>
        </Modal>
      )}

      {previewId && (
        <DashboardPreview reportId={previewId} onClose={()=>setPreviewId(null)} showToast={showToast}/>
      )}
    </Card>
  );
}
