// ── Field maps: UI (CamelCase) ↔ DB (snake_case) ─────────────────────────
const MAPS = {
  clients:      { ClientName:"client_name", ClientType:"client_type", Status:"status", Notes:"notes" },
  assignments:  { ClientName:"client_name", AssignmentType:"assignment_type", Details:"details", FY:"fy", PeriodFrom:"period_from", PeriodTo:"period_to", Status:"status" },
  units:        { ClientName:"client_name", UnitName:"unit_name", AssignmentId:"assignment_id", Frequency:"frequency", Status:"status" },
  app_users:    { Email:"email", Name:"name", Role:"role", AssignedClients:"assigned_clients", AssignedAssignments:"assigned_assignments", AssignedUnits:"assigned_units", Status:"status", AddedBy:"added_by" },
  client_access:{ ClientName:"client_name", Email:"email", Name:"name", Designation:"designation", AccessLevel:"access_level", UnitId:"unit_id", ReportId:"report_id", Status:"status", AddedBy:"added_by" },
  reports:      { ClientName:"client_name", UnitId:"unit_id", UnitName:"unit_name", AssignmentId:"assignment_id", FY:"fy", Status:"status", UploadedBy:"uploaded_by", Period:"period", UDIN:"udin", AdditionalEmails:"additional_emails" },
};

function toUi(table, row) {
  const out = { id: row.id };
  for (const [ui, db] of Object.entries(MAPS[table])) out[ui] = row[db] ?? (Array.isArray(row[db]) ? [] : "");
  return out;
}
function toDb(table, obj) {
  const out = {};
  for (const [ui, db] of Object.entries(MAPS[table])) if (obj[ui] !== undefined) out[db] = obj[ui] === "" ? null : obj[ui];
  return out;
}
async function dbList(table) {
  const { data, error } = await sb.from(table).select("*").order("id");
  if (error) throw new Error(error.message);
  return data.map(r => toUi(table, r));
}
async function dbInsert(table, obj) {
  const { error } = await sb.from(table).insert(toDb(table, obj));
  if (error) throw new Error(error.message);
}
async function dbUpdate(table, id, obj) {
  const { error } = await sb.from(table).update(toDb(table, obj)).eq("id", id);
  if (error) throw new Error(error.message);
}
async function logAction(action, by, details, section) {
  try { await sb.from("audit_trail").insert({ action, performed_by: by, details, section }); } catch {}
}

const TH = ({children,center}) => <th style={{ padding:"9px 12px",textAlign:center?"center":"left",color:P.muted,fontSize:11,fontWeight:700,borderBottom:`2px solid ${P.border}`,background:"#F8FAFC",whiteSpace:"nowrap" }}>{children}</th>;

function CheckPicker({ label, options, selected, onChange, hint }) {
  const all = options.length > 0 && selected.length === options.length;
  const none = selected.length === 0;
  const toggle = val => onChange(selected.includes(val) ? selected.filter(v=>v!==val) : [...selected, val]);
  const toggleAll = () => onChange(all ? [] : options.map(o=>o.value));
  return (
    <div>
      {label&&<label style={{ fontSize:11,fontWeight:700,color:P.muted,letterSpacing:.5,display:"block",marginBottom:5 }}>{label}</label>}
      {hint&&<div style={{ fontSize:11,color:P.muted,marginBottom:6 }}>{hint}</div>}
      <div style={{ border:`1px solid ${P.border}`,borderRadius:8,overflow:"hidden" }}>
        {options.length > 0 ? (
          <>
            <div onClick={toggleAll} style={{ display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#F8FAFC",cursor:"pointer",borderBottom:`1px solid ${P.border}` }}>
              <div style={{ width:16,height:16,borderRadius:4,border:`2px solid ${all?P.blue:P.border}`,background:all?P.blue:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>

                {!all&&!none&&<span style={{ color:P.blue,fontSize:12,fontWeight:900,lineHeight:1 }}>—</span>}
              </div>
              <span style={{ fontSize:12,fontWeight:700,color:P.slate }}>Select All</span>
              {selected.length>0&&<span style={{ fontSize:11,color:P.muted,marginLeft:"auto" }}>{selected.length} of {options.length} selected</span>}
            </div>
            <div style={{ maxHeight:180,overflowY:"auto" }}>
              {options.map(o => (
                <div key={o.value} onClick={()=>toggle(o.value)}
                  style={{ display:"flex",alignItems:"center",gap:10,padding:"8px 12px",cursor:"pointer",borderBottom:`1px solid #F8FAFC`,background:selected.includes(o.value)?"#EFF6FF":"#fff" }}>
                  <div style={{ width:16,height:16,borderRadius:4,border:`2px solid ${selected.includes(o.value)?P.blue:P.border}`,background:selected.includes(o.value)?P.blue:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>
                    {selected.includes(o.value)&&<span style={{ color:"#fff",fontSize:10,fontWeight:900 }}>✓</span>}

                  <span style={{ fontSize:13,color:P.slate }}>{o.label}</span>
                  {o.sub&&<span style={{ fontSize:11,color:P.muted,marginLeft:4 }}>{o.sub}</span>}

// ── OTP LOGIN ─────────────────────────────────────────────────────────────
function LoginScreen({ onDone }) {
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [step, setStep] = useState("email");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const sendCode = async () => {
    setError("");
    const em = email.trim().toLowerCase();
    if (!em.includes("@")) { setError("Enter a valid email address."); return; }
    setBusy(true);
    const { error: err } = await sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: true } });
    setBusy(false);
    if (err) { setError(err.message); return; }
    setStep("code");
  };

  const verify = async () => {
    setError("");
    if (code.trim().length < 6) { setError("Enter the 6-digit code from your email."); return; }
    setBusy(true);
    const { error: err } = await sb.auth.verifyOtp({ email: email.trim().toLowerCase(), token: code.trim(), type: "email" });
    setBusy(false);
    if (err) { setError(err.message); return; }
    onDone();
  };

  return (
    <div style={{ minHeight:"100vh", background:P.ink, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:420 }}>
        <div style={{ textAlign:"center", marginBottom:36 }}>
          <div style={{ display:"inline-flex", alignItems:"center", gap:10, marginBottom:16 }}>
            <div style={{ width:40, height:40, background:P.blue, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, fontWeight:900, color:"#fff" }}>N</div>
            <div style={{ textAlign:"left" }}>
              <div style={{ fontWeight:800, color:"#F8FAFC", fontSize:16 }}>NCLS & Associates</div>
              <div style={{ fontSize:11, color:P.muted }}>Chartered Accountants</div>
            </div>
          </div>
          <div style={{ fontSize:22, fontWeight:800, color:"#F8FAFC", marginBottom:6 }}>Admin Portal</div>
          <div style={{ fontSize:13, color:P.muted }}>Sign in with your email — a one-time code will be sent to you</div>
        </div>
        <div style={{ background:"#1C2333", borderRadius:16, padding:"32px 28px", border:"1px solid #2D3748" }}>
          {step === "email" ? (
            <>
              <label style={{ fontSize:11, fontWeight:700, color:P.muted, letterSpacing:.5, display:"block", marginBottom:6 }}>EMAIL ADDRESS</label>
              <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendCode()}
                placeholder="you@example.com" autoFocus
                style={{ width:"100%", background:"#0D1117", border:`1px solid ${error?"#EF4444":"#2D3748"}`, borderRadius:8, padding:"11px 14px", color:"#F8FAFC", fontSize:14, outline:"none", marginBottom:8 }} />
              {error&&<div style={{ fontSize:12, color:"#EF4444", marginBottom:8 }}>{error}</div>}
              <button onClick={sendCode} disabled={busy}
                style={{ width:"100%", background:busy?"#374151":P.blue, color:"#fff", border:"none", borderRadius:8, padding:"12px 0", fontWeight:700, fontSize:14, marginTop:6, cursor:"pointer" }}>
                {busy?"Sending code...":"Send One-Time Code →"}
              </button>
            </>
          ) : (
            <>
              <div style={{ fontSize:13, color:P.muted, marginBottom:18 }}>Code sent to <strong style={{ color:"#93C5FD" }}>{email}</strong>. Check your inbox (and spam).</div>
              <label style={{ fontSize:11, fontWeight:700, color:P.muted, letterSpacing:.5, display:"block", marginBottom:6 }}>6-DIGIT CODE</label>
              <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,"").slice(0,6))} onKeyDown={e=>e.key==="Enter"&&verify()}
                placeholder="000000" autoFocus maxLength={6}
                style={{ width:"100%", background:"#0D1117", border:`1px solid ${error?"#EF4444":"#2D3748"}`, borderRadius:8, padding:"11px 14px", color:"#F8FAFC", fontSize:22, fontWeight:800, letterSpacing:8, textAlign:"center", outline:"none", marginBottom:8 }} />
              {error&&<div style={{ fontSize:12, color:"#EF4444", marginBottom:8 }}>{error}</div>}
              <button onClick={verify} disabled={busy}
                style={{ width:"100%", background:busy?"#374151":P.blue, color:"#fff", border:"none", borderRadius:8, padding:"12px 0", fontWeight:700, fontSize:14, marginBottom:12, cursor:"pointer" }}>
                {busy?"Verifying...":"Verify & Sign In →"}
              </button>
              <div style={{ textAlign:"center", fontSize:12 }}>
                <span onClick={()=>{setStep("email");setCode("");setError("");}} style={{ color:"#93C5FD", cursor:"pointer" }}>← Change email / resend</span>
              </div>
            </>
          )}
        </div>
        <div style={{ textAlign:"center", marginTop:18, fontSize:11, color:"#374151" }}>
          Access limited to emails authorized by the administrator.
        </div>
      </div>
    </div>
  );
}

// ── SECTIONS (same UI as approved demo, wired to Supabase) ───────────────
function ClientsSection({ user, clients, reload, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({ ClientName:"",ClientType:"",Status:"Active",Notes:"" });

  const save = async () => {
    if (!form.ClientName||!form.ClientType) { showToast("Client name and type required","error"); return; }
    try {
      if (editItem) { await dbUpdate("clients", editItem.id, form); await logAction("Updated client", user.email, form.ClientName, "Clients"); showToast("Client updated"); }
      else { await dbInsert("clients", form); await logAction("Added client", user.email, form.ClientName, "Clients"); showToast("Client added"); }
      setShowAdd(false); setEditItem(null); setForm({ClientName:"",ClientType:"",Status:"Active",Notes:""});
      reload();
    } catch(e) { showToast(e.message,"error"); }
  };
  const toggleStatus = async c => {
    const ns = c.Status==="Active"?"Inactive":"Active";
    try { await dbUpdate("clients", c.id, { Status: ns }); await logAction(`${ns} client`, user.email, c.ClientName, "Clients"); showToast(`Client ${ns.toLowerCase()}`); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };

  return (
    <Card title="Clients" subtitle={`${clients.length} clients`}
      action={<Btn onClick={()=>{setShowAdd(true);setEditItem(null);setForm({ClientName:"",ClientType:"",Status:"Active",Notes:""});}}>+ Add Client</Btn>}>
      <table style={{ width:"100%",borderCollapse:"collapse",fontSize:13 }}>
        <thead><tr><TH>Client Name</TH><TH>Type</TH><TH>Status</TH><TH>Notes</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {clients.map((c,i)=>(
            <tr key={c.id} style={{ borderBottom:`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA" }}>
              <TD bold>{c.ClientName}</TD><TD>{c.ClientType}</TD>
              <td style={{padding:"10px 12px"}}><StatusBadge status={c.Status||"Active"}/></td>
              <TD muted small>{c.Notes}</TD>
              <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:6}}>
                <Btn size="sm" color="gray" onClick={()=>{setEditItem(c);setForm({ClientName:c.ClientName,ClientType:c.ClientType,Status:c.Status,Notes:c.Notes||""});setShowAdd(true);}}>Edit</Btn>
                <Btn size="sm" color={c.Status==="Active"?"red":"green"} outline onClick={()=>toggleStatus(c)}>
                  {c.Status==="Active"?"Deactivate":"Activate"}</Btn>
              </div></td>
            </tr>
          ))}
          {!clients.length&&<tr><td colSpan={5} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No clients yet. Add your first client.</td></tr>}
        </tbody>
      </table>
      {showAdd&&(
        <Modal title={editItem?"Edit Client":"Add Client"} onClose={()=>{setShowAdd(false);setEditItem(null);}}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Inp label="CLIENT NAME" value={form.ClientName} onChange={v=>setForm(f=>({...f,ClientName:v}))} placeholder="e.g. SI Interpack Private Limited" required/>
            <Sel label="CLIENT TYPE" value={form.ClientType} onChange={v=>setForm(f=>({...f,ClientType:v}))} options={CLIENT_TYPES} required placeholder="Select type..."/>
            <Sel label="STATUS" value={form.Status} onChange={v=>setForm(f=>({...f,Status:v}))} options={["Active","Inactive"]}/>
            <Inp label="NOTES" value={form.Notes} onChange={v=>setForm(f=>({...f,Notes:v}))} placeholder="Optional notes"/>
            <div style={{display:"flex",gap:10,marginTop:6}}>

  const clientOptions = clients.map(c=>({value:c.ClientName,label:c.ClientName}));
  const assignmentOptions = assignments.filter(a=>form.AssignedClients.includes(a.ClientName)&&a.Status==="Active")

  const unitOptions = units.filter(u=>form.AssignedClients.includes(u.ClientName)&&u.Status!=="Inactive")

      if (editItem) { await dbUpdate("app_users", editItem.id, payload); await logAction("Updated user", user.email, `${payload.Email} — ${payload.Role}`, "Users"); showToast("User updated"); }

    const ns = u.Status==="Active"?"Inactive":"Active";

    <Card title="Staff & Roles" subtitle={`${users.length} users`}

              <td style={{padding:"10px 12px"}}>
                <div style={{fontWeight:700,color:P.slate}}>{u.Name||"—"}</div>
                <div style={{fontSize:11,color:P.muted}}>{u.Email}</div>
              </td>
              <td style={{padding:"10px 12px"}}><RoleBadge role={u.Role}/></td>
              <TD muted small>{u.AssignedClients?.length ? u.AssignedClients.join(", ") : "All clients"}</TD>
              <td style={{padding:"10px 12px",fontSize:11,color:P.muted}}>

              </td>
              <td style={{padding:"10px 12px"}}><StatusBadge status={u.Status||"Active"}/></td>

                <div style={{display:"flex",gap:6}}>
                  <Btn size="sm" color="gray" onClick={()=>{setEditItem(u);setForm({Email:u.Email,Name:u.Name||"",Role:u.Role,AssignedClients:u.AssignedClients||[],AssignedAssignments:u.AssignedAssignments||[],AssignedUnits:u.AssignedUnits||[],Status:u.Status});setShowAdd(true);}}>Edit</Btn>

function ClientAccessSection({ user, clients, units, reports, access, reload, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [filterClient, setFilterClient] = useState("");
  const [form, setForm] = useState({ ClientName:"",Email:"",Name:"",Designation:"",AccessLevel:"MD",UnitId:"",ReportId:"",Status:"Active" });

  const filteredUnits = units.filter(u=>u.ClientName===form.ClientName);
  const filteredReports = reports.filter(r=>r.ClientName===form.ClientName&&(form.UnitId?r.UnitId===parseInt(form.UnitId):true));
  const filteredAccess = filterClient ? access.filter(a=>a.ClientName===filterClient) : access;

  const getUnitName = id => units.find(u=>u.id===id)?.UnitName||"—";
  const getReportLabel = id => { const r=reports.find(x=>x.id===id); return r?`${r.UnitName} FY${r.FY}`:"—"; };

  const save = async () => {
    if (!form.ClientName||!form.Email||!form.AccessLevel) { showToast("Client, email and access level required","error"); return; }
    if (form.AccessLevel==="Unit Head"&&!form.UnitId) { showToast("Select a unit for Unit Head access","error"); return; }
    if (form.AccessLevel==="Specific Report"&&!form.ReportId) { showToast("Select a report for Specific Report access","error"); return; }
    const payload = { ...form, Email: form.Email.trim().toLowerCase(),
      UnitId: form.UnitId?parseInt(form.UnitId):null, ReportId: form.ReportId?parseInt(form.ReportId):null, AddedBy: user.email };
    try {
      await dbInsert("client_access", payload);
      await logAction("Granted client access", user.email, `${payload.Email} → ${payload.ClientName} (${payload.AccessLevel})`, "ClientAccess");
      showToast("Access granted");
      setShowAdd(false); setForm({ClientName:"",Email:"",Name:"",Designation:"",AccessLevel:"MD",UnitId:"",ReportId:"",Status:"Active"});
      reload();
    } catch(e) { showToast(e.message,"error"); }

    try { await dbUpdate("client_access", a.id, { Status:"Inactive" }); await logAction("Revoked client access", user.email, `${a.Email} → ${a.ClientName}`, "ClientAccess"); showToast("Access revoked"); reload(); }

                 `Report: ${getReportLabel(a.ReportId)}`}
              </TD>
              <td style={{padding:"10px 12px"}}><StatusBadge status={a.Status||"Active"}/></td>
              <td style={{padding:"10px 12px"}}>
                {a.Status==="Active"&&<Btn size="sm" color="red" outline onClick={()=>revoke(a)}>Revoke</Btn>}
              </td>
            </tr>
          ))}
          {!filteredAccess.length&&<tr><td colSpan={7} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No access records found.</td></tr>}
        </tbody>
      </table>
      {showAdd&&(
        <Modal title="Grant Dashboard Access" wide onClose={()=>setShowAdd(false)}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Inp label="FULL NAME" value={form.Name} onChange={v=>setForm(f=>({...f,Name:v}))} placeholder="e.g. Rajesh Sharma"/>
              <Inp label="DESIGNATION" value={form.Designation} onChange={v=>setForm(f=>({...f,Designation:v}))} placeholder="e.g. Managing Director"/>
            </div>
            <Inp label="EMAIL ADDRESS" value={form.Email} onChange={v=>setForm(f=>({...f,Email:v}))} placeholder="md@client.com" required type="email"
              hint="This person receives an OTP to log in to the client dashboard"/>
            <Sel label="CLIENT" value={form.ClientName} onChange={v=>setForm(f=>({...f,ClientName:v,UnitId:"",ReportId:""}))} options={clients.map(c=>c.ClientName)} required placeholder="Select client..."/>
            <Sel label="ACCESS LEVEL" value={form.AccessLevel} onChange={v=>setForm(f=>({...f,AccessLevel:v,UnitId:"",ReportId:""}))} options={["MD","Unit Head","Specific Report"]} required/>
            {form.AccessLevel==="MD"&&(
              <div style={{background:P.purpleLt,border:`1px solid ${P.purpleBd}`,borderRadius:8,padding:"10px 14px",fontSize:12,color:P.purple}}>
                <strong>MD access</strong> — this person will see all reports for all units of <strong>{form.ClientName||"the selected client"}</strong>.
              </div>
            )}
            {form.AccessLevel==="Unit Head"&&(
              <Sel label="UNIT" value={form.UnitId} onChange={v=>setForm(f=>({...f,UnitId:v,ReportId:""}))} required placeholder="Select unit..."
                hint="Unit Head sees all reports for this unit"
                options={filteredUnits.map(u=>({value:String(u.id),label:u.UnitName}))}/>
            )}
            {form.AccessLevel==="Specific Report"&&(
              <>
                <Sel label="UNIT" value={form.UnitId} onChange={v=>setForm(f=>({...f,UnitId:v,ReportId:""}))} placeholder="Filter by unit (optional)"
                  options={filteredUnits.map(u=>({value:String(u.id),label:u.UnitName}))}/>
                <Sel label="REPORT" value={form.ReportId} onChange={v=>setForm(f=>({...f,ReportId:v}))} required placeholder="Select report..."
                  hint="This person will see only this one report"
                  options={filteredReports.map(r=>({value:String(r.id),label:`${r.UnitName} — FY ${r.FY} (${r.Status})`}))}/>
              </>
            )}
            <div style={{display:"flex",gap:10,marginTop:4}}>
              <Btn onClick={save} full>Grant Access</Btn>
              <Btn color="gray" onClick={()=>setShowAdd(false)}>Cancel</Btn>
            </div>
          </div>
        </Modal>
      )}
    </Card>
  );
}

function ReportsSection({ user, reports, reload, showToast }) {
  const [selected, setSelected] = useState(null);
  const [extraEmail, setExtraEmail] = useState("");
  const [filterStatus, setFilterStatus] = useState("");

  const setStatus = async (r, status) => {
    try { await dbUpdate("reports", r.id, { Status: status }); await logAction(`Report ${status}`, user.email, `${r.ClientName} — ${r.UnitName} FY${r.FY}`, "Reports"); showToast(`Report set to ${status}`); reload(); }
    catch(e) { showToast(e.message,"error"); }
  };
  const saveEmails = async (report, updated) => {
    try {
      await dbUpdate("reports", report.id, { AdditionalEmails: updated });
      setSelected(s=>({...s,AdditionalEmails:updated}));
      reload();
    } catch(e) { showToast(e.message,"error"); }
  };
  const addEmail = async () => {
    if (!extraEmail||!extraEmail.includes("@")) { showToast("Valid email required","error"); return; }
    const curr = selected.AdditionalEmails ? selected.AdditionalEmails.split(",").map(e=>e.trim()).filter(Boolean) : [];
    if (curr.includes(extraEmail)) { showToast("Email already added","error"); return; }
    await saveEmails(selected, [...curr, extraEmail.trim().toLowerCase()].join(", "));
    await logAction("Added email to report", user.email, `${extraEmail} → ${selected.ClientName}/${selected.UnitName}`, "Reports");
    setExtraEmail(""); showToast("Email added");
  };
  const removeEmail = async email => {
    const updated = selected.AdditionalEmails.split(",").map(e=>e.trim()).filter(e=>e&&e!==email).join(", ");
    await saveEmails(selected, updated);
    await logAction("Removed email from report", user.email, `${email} from ${selected.ClientName}/${selected.UnitName}`, "Reports");
    showToast("Email removed");
  };

  const filtered = filterStatus ? reports.filter(r=>r.Status===filterStatus) : reports;

  return (
    <Card title="Reports" subtitle={`${reports.length} reports — uploaded via the staff portal`}>
      <div style={{marginBottom:14,maxWidth:200}}>
        <Sel value={filterStatus} onChange={setFilterStatus} options={["Live","Draft","Archived"]} placeholder="Filter by status..."/>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr><TH>Client / Unit</TH><TH>FY</TH><TH>Status</TH><TH>Uploaded By</TH><TH>UDIN</TH><TH>Actions</TH></tr></thead>
        <tbody>
          {filtered.map((r,i)=>(
            <tr key={r.id} style={{borderBottom:`1px solid ${P.border}`,background:i%2===0?P.white:"#FAFAFA"}}>
              <td style={{padding:"10px 12px"}}>
                <div style={{fontWeight:700,color:P.slate}}>{r.ClientName}</div>
                <div style={{fontSize:11,color:P.muted}}>{r.UnitName}</div>
              </td>
              <TD>{r.FY}</TD>
              <td style={{padding:"10px 12px"}}><StatusBadge status={r.Status||"Draft"}/></td>
              <TD muted small>{r.UploadedBy}</TD>
              <TD muted small>{r.UDIN||"—"}</TD>
              <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {r.Status!=="Live"&&<Btn size="sm" color="green" onClick={()=>setStatus(r,"Live")}>Go Live</Btn>}
                {r.Status==="Live"&&<Btn size="sm" color="amber" outline onClick={()=>setStatus(r,"Draft")}>Unpublish</Btn>}
                {r.Status!=="Archived"&&<Btn size="sm" color="gray" onClick={()=>setStatus(r,"Archived")}>Archive</Btn>}
                <Btn size="sm" color="purple" outline onClick={()=>setSelected(r)}>Access</Btn>
              </div></td>
            </tr>
          ))}
          {!filtered.length&&<tr><td colSpan={6} style={{padding:"24px 12px",color:P.muted,textAlign:"center"}}>No reports yet. Reports will appear here once staff upload them.</td></tr>}
        </tbody>
      </table>
      {selected&&(
        <Modal title={`Report Access — ${selected.ClientName} / ${selected.UnitName}`} onClose={()=>setSelected(null)}>
          <div style={{fontSize:12,color:P.muted,marginBottom:14}}>Add or remove specific email access for this report.</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input value={extraEmail} onChange={e=>setExtraEmail(e.target.value)} placeholder="email@domain.com" onKeyDown={e=>e.key==="Enter"&&addEmail()}
              style={{flex:1,border:`1px solid ${P.border}`,borderRadius:7,padding:"8px 10px",fontSize:13,outline:"none"}}/>
            <Btn onClick={addEmail}>Add</Btn>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {selected.AdditionalEmails ? selected.AdditionalEmails.split(",").map(e=>e.trim()).filter(Boolean).map(email=>(
              <div key={email} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:P.blueLt,borderRadius:7,padding:"8px 12px"}}>
                <span style={{fontSize:13,color:P.blue,fontWeight:600}}>{email}</span>
                <Btn size="sm" color="red" outline onClick={()=>removeEmail(email)}>Remove</Btn>
              </div>
            )) : <div style={{fontSize:12,color:P.muted}}>No additional emails. Access inherited from client settings.</div>}
          </div>
        </Modal>
      )}
    </Card>
  );
}

function AuditTrailSection({ trail }) {
  const [filter, setFilter] = useState("");
  const filtered = filter ? trail.filter(t=>t.Section===filter) : trail;
  const fmtDate = s => { try{return new Date(s).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch{return s;} };
  return (
    <Card title="Audit Trail" subtitle="Complete log of all admin actions">
      <div style={{marginBottom:14,maxWidth:220}}>
        <Sel value={filter} onChange={setFilter} options={["Clients","Assignments","Units","Users","ClientAccess","Reports"]} placeholder="Filter by section..."/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map((t,i)=>(
          <div key={t.id||i} style={{display:"flex",gap:12,alignItems:"flex-start",background:i%2===0?P.white:"#FAFAFA",borderRadius:8,padding:"10px 12px",border:`1px solid ${P.border}`}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:P.blue,flexShrink:0,marginTop:6}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600,color:P.slate}}>{t.Action}</div>
              <div style={{fontSize:11,color:P.muted,marginTop:2}}>{t.Details}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:11,color:P.mid,fontWeight:600}}>{t.PerformedBy}</div>
              <div style={{fontSize:10,color:P.muted,marginTop:2}}>{fmtDate(t.PerformedOn)}</div>
            </div>
          </div>
        ))}
        {!filtered.length&&<div style={{padding:"24px 0",color:P.muted,textAlign:"center",fontSize:13}}>No actions logged yet.</div>}
      </div>
    </Card>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────
function App() {
  const [session, setSession]   = useState(null);
  const [user, setUser]         = useState(null);      // { email, name, role }
  const [authState, setAuthState] = useState("loading"); // loading | login | denied | ready
  const [tab, setTab] = useState("clients");
  const [toast, setToast] = useState(null);
  const showToast = (msg,type="success") => setToast({msg,type});

  const [clients, setClients]         = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [units, setUnits]             = useState([]);
  const [users, setUsers]             = useState([]);
  const [access, setAccess]           = useState([]);
  const [reports, setReports]         = useState([]);
  const [trail, setTrail]             = useState([]);

  const loadAll = async () => {
    try {
      const [c,a,u,us,ac,r] = await Promise.all([
        dbList("clients"), dbList("assignments"), dbList("units"),
        dbList("app_users"), dbList("client_access"), dbList("reports"),
      ]);
      setClients(c); setAssignments(a); setUnits(u); setUsers(us); setAccess(ac); setReports(r);
      const { data: tr } = await sb.from("audit_trail").select("*").order("id", { ascending:false }).limit(150);
      setTrail((tr||[]).map(t=>({ id:t.id, Action:t.action, PerformedBy:t.performed_by, PerformedOn:t.performed_on, Details:t.details, Section:t.section })));
    } catch(e) { showToast("Load failed: "+e.message, "error"); }
  };

  const resolveUser = async (sess) => {
    const email = sess?.user?.email?.toLowerCase();
    if (!email) { setAuthState("login"); return; }
    if (email === SUPER_ADMIN) {
      setUser({ email, name:"Ashish Gupta", role:"Super Admin" });
      setAuthState("ready"); return;
    }
    const { data, error } = await sb.from("app_users").select("*").eq("email", email).eq("status","Active").maybeSingle();
    if (error || !data || !["Admin","Senior Partner","Partner"].includes(data.role)) {
      setAuthState("denied");
      return;
    }
    setUser({ email, name: data.name || email, role: data.role });
    setAuthState("ready");
  };

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      if (data.session) resolveUser(data.session); else setAuthState("login");
    });
    const { data: sub } = sb.auth.onAuthStateChange((_evt, sess) => {
      setSession(sess);
      if (sess) resolveUser(sess); else { setUser(null); setAuthState("login"); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => { if (authState==="ready") loadAll(); }, [authState]);

  const signOut = async () => { await sb.auth.signOut(); };

  if (authState==="loading") return (
    <div style={{minHeight:"100vh",background:P.ink,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{color:"#9CA3AF",fontSize:14}}>Loading...</div>
    </div>
  );

  if (authState==="login") return <LoginScreen onDone={()=>{}} />;

  if (authState==="denied") return (
    <div style={{minHeight:"100vh",background:P.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:P.redLt,border:`1px solid ${P.redBd}`,borderRadius:14,padding:"32px",maxWidth:480,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12}}>🔒</div>
        <div style={{fontSize:17,fontWeight:800,color:P.red,marginBottom:8}}>Not Authorized</div>
        <div style={{fontSize:13,color:"#991B1B",marginBottom:20}}>
          Your email is verified, but it is not on the admin access list (Admin, Senior Partner or Partner role required). Contact the administrator.
        </div>
        <Btn color="red" outline onClick={signOut}>Sign out</Btn>
      </div>
    </div>
  );

  const TABS = [
    {id:"clients",     label:"Clients",       icon:"🏢"},
    {id:"assignments", label:"Assignments",   icon:"📌"},
    {id:"units",       label:"Units",         icon:"🏭"},
    {id:"users",       label:"Staff & Roles", icon:"👥"},
    {id:"access",      label:"Client Access", icon:"🔑"},
    {id:"reports",     label:"Reports",       icon:"📋"},
    {id:"trail",       label:"Audit Trail",   icon:"📜"},
  ];

  return (
    <div style={{minHeight:"100vh",background:P.bg}}>
      <div style={{background:P.ink,padding:"0 28px",position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1380,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:56}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:32,height:32,background:P.blue,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:900,color:"#fff"}}>N</div>
            <span style={{fontWeight:800,color:"#F8FAFC",fontSize:15}}>NCLS & Associates</span>
            <span style={{color:"#374151"}}>·</span>
            <span style={{fontSize:13,color:"#9CA3AF"}}>Admin Portal</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <RoleBadge role={user.role}/>
            <span style={{fontSize:12,color:"#6B7280"}}>{user.name||user.email}</span>
            <button onClick={signOut} style={{background:"#1C2333",color:"#9CA3AF",border:"1px solid #2D3748",borderRadius:7,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Sign out</button>
          </div>
        </div>
      </div>

      <div style={{background:P.white,borderBottom:`1px solid ${P.border}`,padding:"0 28px",overflowX:"auto"}}>
        <div style={{maxWidth:1380,margin:"0 auto",display:"flex"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              background:"transparent",border:"none",padding:"14px 16px",
              fontWeight:tab===t.id?800:500,fontSize:13,
              color:tab===t.id?P.blue:P.muted,
              borderBottom:tab===t.id?`3px solid ${P.blue}`:"3px solid transparent",
              cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:6
            }}>{t.icon} {t.label}</button>
          ))}
        </div>
      </div>

      <div style={{maxWidth:1380,margin:"0 auto",padding:"28px"}}>
        {tab==="clients"     && <ClientsSection     user={user} clients={clients} reload={loadAll} showToast={showToast}/>}
        {tab==="assignments" && <AssignmentsSection user={user} clients={clients} assignments={assignments} reload={loadAll} showToast={showToast}/>}
        {tab==="units"       && <UnitsSection       user={user} clients={clients} assignments={assignments} units={units} reload={loadAll} showToast={showToast}/>}
        {tab==="users"       && <UsersSection       user={user} clients={clients} assignments={assignments} units={units} users={users} reload={loadAll} showToast={showToast}/>}
        {tab==="access"      && <ClientAccessSection user={user} clients={clients} units={units} reports={reports} access={access} reload={loadAll} showToast={showToast}/>}
        {tab==="reports"     && <ReportsSection     user={user} reports={reports} reload={loadAll} showToast={showToast}/>}
        {tab==="trail"       && <AuditTrailSection  trail={trail}/>}
      </div>

      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
<script>
  window.addEventListener('error', function(e) {
    const r = document.getElementById('root');
    if (r && !r.hasChildNodes())
      r.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#DC2626;background:#FEF2F2;border-radius:12px;margin:40px auto;max-width:500px;border:1px solid #FECACA"><h2>Portal failed to load</h2><p>' + (e.message||'Unknown error') + '</p><p style="font-size:13px;color:#7F1D1D">Check your internet connection and refresh.</p></div>';
  });
  const src = document.getElementById('app-source').textContent;
  const out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  const s = document.createElement('script'); s.textContent = out; document.body.appendChild(s);
</script>
</body>
