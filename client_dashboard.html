function readableError(err){
  const m=(err?.message||String(err)||"").toLowerCase();
  if(m.includes("rate limit")||m.includes("too many")) return "Too many attempts. Please wait a minute and try again.";
  if(m.includes("invalid")||m.includes("expired")) return "That code is not valid or has expired. Request a new one.";
  if(m.includes("not authorized")||m.includes("not allowed")) return "This email does not have access. Contact NCLS & Associates.";
  if(m.includes("network")||m.includes("fetch")) return "Network problem. Check your connection and try again.";
  return err?.message || "Something went wrong. Please try again.";
}

function RiskDonut({ risk, size=220 }) {
  const data = RISK_ORDER.map(k => ({ name:k, value: risk[k.toLowerCase()]||0 })).filter(d=>d.value>0);
  if (!data.length) return <div style={{ fontSize:12, color:P.muted, textAlign:"center", padding:"40px 0" }}>No risk data</div>;
  return (
    <ResponsiveContainer width="100%" height={size}>
      <PieChart>
        <Pie data={data} dataKey="value" nameKey="name" innerRadius="52%" outerRadius="82%" paddingAngle={2}>
          {data.map((d,i) => <Cell key={i} fill={RISK[d.name]} />)}
        </Pie>
        <Tooltip/>
        <Legend verticalAlign="bottom" height={30} iconType="circle" wrapperStyle={{fontSize:12}}/>
      </PieChart>
    </ResponsiveContainer>
  );
}

function RootCauseDonut({ rootCauseRollup, size=220 }) {
  if (!rootCauseRollup || !rootCauseRollup.length) return <div style={{ fontSize:12, color:P.muted, textAlign:"center", padding:"40px 0" }}>No root cause data</div>;

    <ResponsiveContainer width="100%" height={size}>

        <Pie data={rootCauseRollup} dataKey="value" nameKey="name" innerRadius="52%" outerRadius="82%" paddingAngle={2}>
          {rootCauseRollup.map((d,i) => <Cell key={i} fill={ROOT_CAUSE_COLORS[i % ROOT_CAUSE_COLORS.length]} />)}

      </PieChart>

}

// ── Build a consolidated (company-level) summary from a set of reports ────
function buildConsolidated(reports, commonRows) {
  const totals = { critical:0, high:0, medium:0, low:0 };
  const units = [];
  const areaMap = {};
  const limitationsMap = {};
  const repeatedByUnit = {};
  const rootCauseMap = {};
  const allObs = [];            // every observation, flattened — powers drill-down
  const priorObs = [];          // prior-year open items from the report's own section
  const mismatches = [];        // where the exec summary disagrees with the counted observations
  const finImpactMap = {};      // category -> { total, byUnit }
  const priorOpenByArea = {};   // area -> unit -> count (from is_repeated + pending days)
  const repeatedObsByArea = {};

  reports.forEach(r => {
    const j = r.report_json || {};
    const unit = r.unit_name;
    // Counts are derived by COUNTING the actual observations, never taken from
    // the executive-summary block. The summary is used only to flag mismatches.
    const claimed = j.audit_summary?.observation_count_by_risk || {};
    const tally = { critical:0, high:0, medium:0, low:0 };
    (j.areas||[]).forEach(a=>(a.observations||[]).forEach(o=>{
      const k = String(o.risk_level||"").toLowerCase();
      if (tally[k] !== undefined) tally[k]++;
    }));
    const c=tally.critical, h=tally.high, m=tally.medium, l=tally.low;
    totals.critical+=c; totals.high+=h; totals.medium+=m; totals.low+=l;

    const mism = ["critical","high","medium","low"]
      .filter(k => (claimed[k]||0) !== tally[k])
      .map(k => `${k}: summary says ${claimed[k]||0}, counted ${tally[k]}`);
    if (mism.length) mismatches.push({ unit, fy:r.fy, detail:mism });

    let repeatedCount=0, newCount=0;
    (j.areas||[]).forEach(area=>{
      const areaName = area.area_name || "Unspecified";
      (area.observations||[]).forEach((obs,oi)=>{
        const rec = { ...obs, unit, fy:r.fy, area:areaName, reportId:r.id, key:`${r.id}-${areaName}-${oi}` };
        allObs.push(rec);
        if (obs.is_repeated) {
          repeatedCount++;
          if(!repeatedObsByArea[areaName]) repeatedObsByArea[areaName]={};
          repeatedObsByArea[areaName][unit] = (repeatedObsByArea[areaName][unit]||0)+1;
        } else newCount++;
        const rc = obs.root_cause || "Not stated";
        rootCauseMap[rc] = (rootCauseMap[rc]||0) + 1;
        const fi = parseImpact(obs.financial_impact);
        if (fi.amount > 0) {
          const cat = fi.category;
          if(!finImpactMap[cat]) finImpactMap[cat]={ category:cat, total:0, byUnit:{}, obs:[] };
          finImpactMap[cat].total += fi.amount;
          finImpactMap[cat].byUnit[unit] = (finImpactMap[cat].byUnit[unit]||0) + fi.amount;
          finImpactMap[cat].obs.push(rec);
        }
      });
    });

    (j.previous_audit_noncompliance||[]).forEach(p=>{
      const areaName = p.area || "Unspecified";
      const rec = { title:p.title, area:areaName, unit, fy:r.fy, risk_level:"—",
        action_plan:p.action_plan, target_date:p.target_date, responsible:p.responsible,
        pending_since_days:p.pending_since_days, is_prior:true, reportId:r.id,
        key:`${r.id}-prior-${areaName}-${p.title}` };
      priorObs.push(rec);
      if(!priorOpenByArea[areaName]) priorOpenByArea[areaName]={};
      priorOpenByArea[areaName][unit] = (priorOpenByArea[areaName][unit]||0)+1;
    });

    const limCount = (j.limitations||[]).reduce((n,x)=>n+((x.items||[]).length),0);
    units.push({ unitName:unit, fy:r.fy, rating:j.report_metadata?.overall_rating||"",
      critical:c,high:h,medium:m,low:l, total:c+h+m+l, repeatedCount, newCount,
      limitations:limCount, reportId:r.id,
      areas:(j.areas||[]).reduce((acc,a)=>{
        const nm=a.area_name||"Unspecified";
        const t={c:0,h:0,m:0,l:0,t:0};
        (a.observations||[]).forEach(o=>{
          const k=String(o.risk_level||"").toLowerCase();
          if(k==="critical")t.c++; else if(k==="high")t.h++; else if(k==="medium")t.m++; else if(k==="low")t.l++;
          t.t++;
        });
        acc[nm]=t; return acc; },{}) });

    if(!repeatedByUnit[unit]) repeatedByUnit[unit]=[];
    repeatedByUnit[unit].push({ fy:r.fy, repeated:repeatedCount, new:newCount, total:repeatedCount+newCount });

    (j.areas||[]).forEach(ar=>{
      const nm=ar.area_name||"Unspecified";
      if(!areaMap[nm]) areaMap[nm]={area:nm,critical:0,high:0,medium:0,low:0,total:0,units:new Set()};
      const a=areaMap[nm];
      (ar.observations||[]).forEach(o=>{
        const k=String(o.risk_level||"").toLowerCase();
        if(a[k]!==undefined)a[k]++;
        a.total++;
      });
      a.units.add(unit);
    });

    (j.limitations||[]).forEach(lim=>{
      if(!lim.area || !(lim.items||[]).length) return;
      if(!limitationsMap[lim.area]) limitationsMap[lim.area]={area:lim.area, units:new Set(), itemsByUnit:{}};
      limitationsMap[lim.area].units.add(unit);
      limitationsMap[lim.area].itemsByUnit[unit] = lim.items;
    });
  });

  // Common observations come from the curated list the audit team uploads via
  // the Staff Portal — they are never auto-detected.
  const groupMap = {};
  (commonRows||[]).forEach(row=>{
    const g = row.group_label;
    if(!groupMap[g]) groupMap[g]={ title:g, process:row.area||"", risk:row.risk_level||"Low", units:new Set(), obs:[] };
    groupMap[g].units.add(row.unit_name);
    if (RISK_ORDER.indexOf(row.risk_level) >= 0 &&
        RISK_ORDER.indexOf(row.risk_level) < RISK_ORDER.indexOf(groupMap[g].risk)) groupMap[g].risk = row.risk_level;
    const match = allObs.find(o=>o.unit===row.unit_name &&
      (o.title||"").trim().toLowerCase() === String(row.title||"").trim().toLowerCase());
    groupMap[g].obs.push(match || { title:row.title, unit:row.unit_name, area:row.area,
      risk_level:row.risk_level, fy:"", key:`curated-${g}-${row.unit_name}` });
  });
  const commonObservations = Object.values(groupMap)
    .filter(x=>x.units.size>1)
    .map(x=>({ ...x, unitList:[...x.units] }))
    .sort((a,b)=>b.units.size-a.units.size);

  const areaRollup = Object.values(areaMap).map(a=>({...a,unitCount:a.units.size,unitList:[...a.units]})).sort((a,b)=>b.total-a.total);
  const limitationsRollup = Object.values(limitationsMap).map(l=>({...l,unitCount:l.units.size})).sort((a,b)=>b.unitCount-a.unitCount);
  Object.values(repeatedByUnit).forEach(arr=>arr.sort((a,b)=>String(a.fy).localeCompare(String(b.fy))));
  const repeatedTotals = units.reduce((acc,u)=>({repeated:acc.repeated+u.repeatedCount, new:acc.new+u.newCount}),{repeated:0,new:0});
  const rootCauseRollup = Object.entries(rootCauseMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
  const finImpact = Object.values(finImpactMap).sort((a,b)=>b.total-a.total);

  units.forEach(u=>{
    const ar = Object.entries(u.areas);
    u.weakestArea = ar.length ? ar.sort((a,b)=>b[1].t-a[1].t)[0][0] + ` (${ar.sort((a,b)=>b[1].t-a[1].t)[0][1].t})` : "—";
    const crit = ar.filter(([,v])=>v.c>0).sort((a,b)=>b[1].c-a[1].c);
    u.highestCriticalArea = crit.length ? `${crit[0][0]} (${crit[0][1].c})` : "—";
  });

  return {
    totals:{...totals,total:totals.critical+totals.high+totals.medium+totals.low},
    units:units.sort((a,b)=>b.total-a.total),
    areaRollup, limitationsRollup, repeatedByUnit, repeatedTotals, rootCauseRollup,
    allObs, priorObs, commonObservations, finImpact, repeatedObsByArea, priorOpenByArea, mismatches,
    unitNames:[...new Set(units.map(u=>u.unitName))],
  };
}

// Parse "financial_impact" free text into a numeric amount (in ₹ Lakhs) + category
function parseImpact(txt) {
  if (!txt || typeof txt !== "string") return { amount:0, category:"" };
  const s = txt.trim();
  if (/^(not applicable|not provided|n\/?a|—|-)$/i.test(s)) return { amount:0, category:"" };
  const num = parseFloat((s.match(/[\d,]+(?:\.\d+)?/)||["0"])[0].replace(/,/g,""));
  if (!num) return { amount:0, category:"" };
  let lakhs = num;
  if (/crore|\bcr\b/i.test(s)) lakhs = num * 100;
  else if (/lakh|\bl\b/i.test(s)) lakhs = num;
  else lakhs = num / 100000;               // bare rupees
  let category = "Already Incurred Losses";
  if (/saving|recover|opportunit/i.test(s)) category = "Potential Revenue / Savings";
  else if (/potential|future|risk|expos/i.test(s)) category = "Potential Future Losses";
  else if (/missed|lost|foregone/i.test(s)) category = "Missed Revenue / Savings";
  return { amount: Math.round(lakhs*100)/100, category };
}

  if(!t) return <div style={{height,background:P.border,borderRadius:3}}/>;
  return <div style={{display:"flex",height,borderRadius:3,overflow:"hidden",gap:1}}>
    {[{v:c,col:RISK.Critical},{v:h,col:RISK.High},{v:m,col:RISK.Medium},{v:l,col:RISK.Low}]
      .map((s,i)=>s.v>0&&<div key={i} style={{flex:s.v,background:s.col}}/>)}
  </div>;
}

    style={{ background:(color||P.slate)+"18", color:color||P.slate, borderRadius:5, padding:"2px 10px",
      fontWeight:bold?800:700, fontSize:12, cursor:onClick?"pointer":"default",
      textDecoration:onClick?"underline dotted":"none", textUnderlineOffset:3 }}>{value}</span>;
};

// ── Drill-down panel: shows the actual observations behind any number ────
function DrillPanel({ title, obs, onClose }) {
  const [openIdx,setOpenIdx]=useState(null);
  return (
    <div style={{ position:"fixed", inset:0, zIndex:80, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={onClose} style={{ position:"absolute", inset:0, background:"rgba(15,23,42,.45)" }}/>
      <div style={{ position:"relative", background:P.white, width:"100%", maxWidth:1000, maxHeight:"85vh",
        borderRadius:"16px 16px 0 0", display:"flex", flexDirection:"column", boxShadow:"0 -8px 40px rgba(0,0,0,.2)" }}>
        <div style={{ padding:"18px 24px", borderBottom:`1px solid ${P.border}`, display:"flex",
          justifyContent:"space-between", alignItems:"center", gap:12 }}>
          <div>
            <div style={{ fontSize:15, fontWeight:800, color:P.ink }}>{title}</div>
            <div style={{ fontSize:12, color:P.muted, marginTop:2 }}>{obs.length} observation{obs.length===1?"":"s"} · click any row for full detail</div>
          </div>
          <button onClick={onClose} style={{ background:"#F1F5F9", border:"none", borderRadius:8, width:34, height:34,
            fontSize:17, color:P.muted, cursor:"pointer", flexShrink:0 }}>✕</button>
        </div>
        <div style={{ overflowY:"auto", padding:"8px 0" }}>
          {obs.length===0 && <div style={{ padding:40, textAlign:"center", color:P.muted, fontSize:13 }}>No observations found.</div>}
          {obs.map((o,i)=>(
            <div key={o.key||i}>
              <div onClick={()=>setOpenIdx(openIdx===i?null:i)}
                style={{ display:"flex", gap:12, alignItems:"center", padding:"12px 24px", cursor:"pointer",
                  borderBottom:`1px solid ${P.border}`, background: openIdx===i ? "#F8FAFC" : "transparent" }}>
                <span style={{ width:8, height:8, borderRadius:"50%", background:RISK[o.risk_level]||P.muted, flexShrink:0 }}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:P.slate }}>{o.title}</div>
                  <div style={{ fontSize:11, color:P.muted, marginTop:2 }}>{o.unit} · {o.area} · FY {o.fy}</div>
                </div>
                {o.is_repeated && <span style={{ background:P.amberLt, color:P.amber, border:`1px solid ${P.amberBd}`,
                  borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:800, flexShrink:0 }}>REPEATED</span>}
                <span style={{ background:(RISK[o.risk_level]||P.muted)+"18", color:RISK[o.risk_level]||P.muted,
                  borderRadius:5, padding:"2px 9px", fontSize:11, fontWeight:700, flexShrink:0 }}>{o.risk_level}</span>
              </div>
              {openIdx===i && (
                <div style={{ padding:"16px 24px 22px 44px", background:"#FBFCFE", borderBottom:`1px solid ${P.border}` }}>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:14 }}>
                    {[["RESPONSIBLE",o.responsible],["TARGET DATE",o.target_date],["ROOT CAUSE",o.root_cause]].map(([k,v])=>(
                      <div key={k}><div style={{fontSize:10,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:3}}>{k}</div>
                        <div style={{fontSize:13,color:P.slate,fontWeight:600}}>{v||"—"}</div></div>
                    ))}
                  </div>
                  {o.is_repeated && <div style={{background:P.amberLt,border:`1px solid ${P.amberBd}`,borderRadius:8,
                    padding:"8px 12px",marginBottom:14,fontSize:12,color:P.amber}}>
                    <strong>Repeated from a prior audit</strong>{o.pending_since_days?` — pending ${o.pending_since_days} days`:""}</div>}
                  {o.financial_impact && <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,
                    padding:"8px 12px",marginBottom:14,fontSize:12,color:"#9A3412"}}>
                    <strong>Financial impact:</strong> {o.financial_impact}</div>}
                  {o.observation && <div style={{marginBottom:14}}>
                    <div style={{fontSize:10,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:4}}>OBSERVATION</div>
                    <div style={{fontSize:13,color:P.mid,lineHeight:1.65}}>{o.observation}</div></div>}
                  {o.action_plan && <div style={{background:P.greenLt,border:`1px solid ${P.greenBd}`,borderRadius:8,padding:"12px 14px"}}>
                    <div style={{fontSize:10,fontWeight:700,color:P.green,letterSpacing:.5,marginBottom:4}}>MANAGEMENT ACTION PLAN</div>
                    <div style={{fontSize:13,color:"#166534",lineHeight:1.65}}>{o.action_plan}</div></div>}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── The 9-tab consolidated view — every number is data-driven & clickable ─
function ConsolidatedView({ clientName, reports, commonRows, onSelectUnit }) {
  const [active,setActive]=useState("overview");
  const [drill,setDrill]=useState(null);   // { title, obs }
  const [selUnit,setSelUnit]=useState(null);
  const [filter,setFilter]=useState("All");
  const [openLim,setOpenLim]=useState(null);

  const D = buildConsolidated(reports, commonRows);
  const U = D.unitNames;
  if (!reports.length) return null;
  const uc = n => unitColor(n, U);
  const show = (title, obs) => setDrill({ title, obs });
  const by = f => D.allObs.filter(f);

  const NAV = [
    { id:"overview",    label:"Overview" },
    { id:"keyinst",     label:"Key Instances" },
    { id:"financial",   label:"Financial Impact" },
    { id:"comparative", label:"Comparative Analysis" },
    { id:"areawise",    label:"Area-wise" },
    { id:"common",      label:"Common Observations" },
    { id:"repeated",    label:"Repeated Observations" },
    { id:"prioryear",   label:"Prior Year Open" },
    { id:"limitations", label:"Limitations" },
  ];

  // ---- Key instances, computed from actual data ----
  const topObs = [...D.units].sort((a,b)=>b.total-a.total)[0];
  const topCrit = [...D.units].sort((a,b)=>b.critical-a.critical)[0];
  const topRep  = [...D.units].sort((a,b)=>b.repeatedCount-a.repeatedCount)[0];
  const topLim  = [...D.units].sort((a,b)=>b.limitations-a.limitations)[0];
  const keyInstances = [
    topObs && { metric:String(topObs.total), label:`${topObs.unitName} had the highest number of observations (${topObs.total}) of the ${D.totals.total} raised across all units.`,
      obs: by(o=>o.unit===topObs.unitName), t:`All observations — ${topObs.unitName}` },
    topCrit && topCrit.critical>0 && { metric:String(topCrit.critical), label:`${topCrit.unitName} had the most critical observations — ${topCrit.critical} of ${D.totals.critical} critical across all units.`,
      obs: by(o=>o.unit===topCrit.unitName&&o.risk_level==="Critical"), t:`Critical observations — ${topCrit.unitName}` },
    topRep && topRep.repeatedCount>0 && { metric:String(topRep.repeatedCount), label:`${topRep.unitName} had the most repeated observations (${topRep.repeatedCount} of ${D.repeatedTotals.repeated} total) — issues not actioned since the prior audit.`,
      obs: by(o=>o.unit===topRep.unitName&&o.is_repeated), t:`Repeated observations — ${topRep.unitName}` },
    topLim && topLim.limitations>0 && { metric:String(topLim.limitations), label:`${topLim.unitName} had the highest number of scope limitations (${topLim.limitations}) — data not made available to the auditors.` },
    { metric:String(D.totals.total), label:`${D.totals.total} total observations across ${U.length} unit${U.length===1?"":"s"}, of which ${D.totals.critical} are critical and ${D.totals.high} high risk.`,
      obs: D.allObs, t:"All observations" },
  ].filter(Boolean);

  return (
    <div style={{ marginBottom:28 }}>
      {/* Tab nav */}
      <div style={{ background:P.white, border:`1px solid ${P.border}`, borderRadius:12, padding:"0 8px",
        marginBottom:20, overflowX:"auto" }}>
        <div style={{ display:"flex" }}>
          {NAV.map(it=>(
            <button key={it.id} onClick={()=>setActive(it.id)} style={{ background:"transparent", border:"none",
              padding:"13px 16px", fontWeight:active===it.id?800:500, fontSize:13,
              color:active===it.id?P.blue:P.muted, cursor:"pointer", whiteSpace:"nowrap",
              borderBottom:active===it.id?`3px solid ${P.blue}`:"3px solid transparent" }}>{it.label}</button>
          ))}
        </div>
      </div>

      {/* ---------- OVERVIEW ---------- */}
      {active==="overview" && (
        <Section title={`${clientName} — Overview`} sub={`Units: ${U.join(", ")}`} accent={P.blue}>
          {D.mismatches.length>0 && (
            <div style={{background:P.amberLt,border:`1px solid ${P.amberBd}`,borderRadius:10,padding:"12px 16px",marginBottom:20}}>
              <div style={{fontSize:12,fontWeight:800,color:P.amber,marginBottom:6}}>⚠ Figures below are counted from the observations, and differ from the executive summary in the report</div>
              {D.mismatches.map((m,i)=>(
                <div key={i} style={{fontSize:12,color:P.amber,marginTop:3}}>
                  <strong>{m.unit} (FY {m.fy})</strong> — {m.detail.join("; ")}
                </div>
              ))}
            </div>
          )}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14, marginBottom:28 }}>
            {[["Total Observations",D.totals.total,P.blue,"#EFF6FF",D.allObs,"All observations"],
              ["Repeated Observations",D.repeatedTotals.repeated,P.amber,"#FFFBEB",by(o=>o.is_repeated),"All repeated observations"],
              ["Prior Year Still Open",D.priorObs.length,P.purple,"#F5F3FF",D.priorObs,"Prior-year observations still open"]
            ].map(([l,v,col,bg,ob,t])=>(
              <div key={l} onClick={()=>ob&&show(t,ob)} style={{ background:bg, borderRadius:10, padding:"18px 20px", cursor:ob?"pointer":"default" }}>
                <div style={{ fontSize:34, fontWeight:900, color:col, lineHeight:1 }}>{v}</div>
                <div style={{ fontSize:12, color:P.muted, marginTop:6, fontWeight:600 }}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{ marginBottom:28, overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead><tr>{["UNIT","CRITICAL","HIGH","MEDIUM","LOW","TOTAL","SPLIT"].map(h=>
                <th key={h} style={h==="UNIT"?THs("left"):THs()}>{h}</th>)}</tr></thead>
              <tbody>
                {D.units.map((u,i)=>(
                  <tr key={u.unitName+u.fy} style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}` }}>
                    <td style={TDs("left",{fontWeight:700,color:P.ink})}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:uc(u.unitName),flexShrink:0}}/>
                        <span onClick={()=>onSelectUnit&&onSelectUnit(reports.find(r=>r.id===u.reportId))}
                          style={{cursor:"pointer",textDecoration:"underline dotted",textUnderlineOffset:3}}>{u.unitName}</span>
                      </div></td>
                    {["critical","high","medium","low"].map(k=>{
                      const cap=k[0].toUpperCase()+k.slice(1);
                      return <td key={k} style={TDs()}>
                        <Num value={u[k]} color={RISK[cap]}
                          onClick={()=>show(`${cap} observations — ${u.unitName}`, by(o=>o.unit===u.unitName&&o.risk_level===cap))}/>
                      </td>;})}
                    <td style={TDs("center")}><Num value={u.total} bold
                      onClick={()=>show(`All observations — ${u.unitName}`, by(o=>o.unit===u.unitName))}/></td>
                    <td style={{padding:"9px 12px"}}><Stack c={u.critical} h={u.high} m={u.medium} l={u.low} t={u.total} height={8}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          </Section>
      )}

      {/* ---------- KEY INSTANCES ---------- */}
      {active==="keyinst" && (
        <Section title="Key Instances — Audit at a Glance" sub="Standout findings across all units · click a card to see the observations behind it" accent={P.red}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:14 }}>
            {keyInstances.map((item,i)=>(
              <div key={i} onClick={()=>item.obs&&show(item.t,item.obs)}
                style={{ display:"flex", gap:16, alignItems:"flex-start", background:"#F8FAFC", borderRadius:10,
                  padding:"16px 18px", borderLeft:`3px solid ${P.blue}`, cursor:item.obs?"pointer":"default" }}>
                <div style={{ fontSize:26, fontWeight:900, color:P.blue, minWidth:64, lineHeight:1.1, flexShrink:0 }}>{item.metric}</div>
                <div style={{ fontSize:13, color:P.mid, lineHeight:1.65 }}>{item.label}</div>
              </div>
            ))}
          </div>
        </Section>
      )}

      {/* ---------- FINANCIAL IMPACT ---------- */}
      {active==="financial" && (() => {
        const impObs = D.allObs.filter(o=>parseImpact(o.financial_impact).amount>0)
          .map(o=>({...o, _amt:parseImpact(o.financial_impact).amount}))
          .sort((a,b)=>b._amt-a._amt);
        const total = impObs.reduce((a,o)=>a+o._amt,0);
        const byUnit = {};
        impObs.forEach(o=>{ byUnit[o.unit]=(byUnit[o.unit]||0)+o._amt; });
        return (
          <Section title="Observations with Financial Impact" sub="All amounts in ₹ Lakhs · click any row for full observation detail" accent={P.amber}>
            {impObs.length===0 ? (
              <div style={{padding:"30px",textAlign:"center",color:P.muted,fontSize:13}}>
                No observations in the uploaded reports carry a quantified financial impact.
              </div>
            ) : (<>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14, marginBottom:24 }}>
                <div onClick={()=>show("All observations with a financial impact", impObs)}
                  style={{ background:"#FFFBEB", borderRadius:10, padding:"18px 20px", cursor:"pointer" }}>
                  <div style={{ fontSize:32, fontWeight:900, color:P.amber, lineHeight:1 }}>₹{total.toLocaleString("en-IN")} L</div>
                  <div style={{ fontSize:12, color:P.muted, marginTop:6, fontWeight:600 }}>Total Financial Impact</div>
                </div>
                <div onClick={()=>show("All observations with a financial impact", impObs)}
                  style={{ background:"#EFF6FF", borderRadius:10, padding:"18px 20px", cursor:"pointer" }}>
                  <div style={{ fontSize:32, fontWeight:900, color:P.blue, lineHeight:1 }}>{impObs.length}</div>
                  <div style={{ fontSize:12, color:P.muted, marginTop:6, fontWeight:600 }}>Observations Quantified</div>
                </div>
              </div>
              <div style={{ overflowX:"auto", marginBottom:24 }}>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr><th style={THs("left")}>UNIT</th><th style={THs("left")}>AREA</th>
                    <th style={THs("left")}>OBSERVATION</th><th style={THs()}>RISK</th>
                    <th style={THs("right")}>IMPACT (₹ L)</th></tr></thead>
                  <tbody>
                    {impObs.map((o,i)=>(
                      <tr key={o.key||i} onClick={()=>show(o.title,[o])}
                        style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}`, cursor:"pointer" }}>
                        <td style={TDs("left",{fontWeight:700,color:P.ink,whiteSpace:"nowrap"})}>
                          <div style={{display:"flex",alignItems:"center",gap:7}}>
                            <div style={{width:7,height:7,borderRadius:"50%",background:uc(o.unit)}}/>{o.unit}</div></td>
                        <td style={TDs("left",{color:P.mid,fontSize:12,whiteSpace:"nowrap"})}>{o.area}</td>
                        <td style={TDs("left",{color:P.slate,fontSize:12,maxWidth:340})}>{o.title}</td>
                        <td style={TDs()}><span style={{background:(RISK[o.risk_level]||P.muted)+"18",
                          color:RISK[o.risk_level]||P.muted,borderRadius:4,padding:"2px 8px",fontSize:11,fontWeight:700}}>{o.risk_level}</span></td>
                        <td style={TDs("right",{fontWeight:800,color:P.amber})}>₹{o._amt.toLocaleString("en-IN")}</td>
                      </tr>
                    ))}
                    <tr style={{ background:"#FFFBEB", borderTop:`2px solid ${P.amberBd}` }}>
                      <td style={TDs("left",{fontWeight:800,color:P.ink})} colSpan={4}>Total</td>
                      <td style={TDs("right",{fontWeight:900,color:P.amber})}>₹{total.toLocaleString("en-IN")}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
                {Object.entries(byUnit).sort((a,b)=>b[1]-a[1]).map(([n,v])=>(
                  <div key={n} onClick={()=>show(`Financial impact — ${n}`, impObs.filter(o=>o.unit===n))}
                    style={{ background:"#F8FAFC", border:`1px solid ${P.border}`, borderLeft:`4px solid ${uc(n)}`,
                      borderRadius:9, padding:"12px 16px", minWidth:150, cursor:"pointer" }}>
                    <div style={{fontSize:11,fontWeight:700,color:P.muted}}>{n.toUpperCase()}</div>
                    <div style={{fontSize:22,fontWeight:900,color:P.amber,marginTop:3}}>₹{v.toLocaleString("en-IN")} L</div>
                  </div>
                ))}
              </div>
            </>)}
          </Section>
        );
      })()}

      {/* ---------- COMPARATIVE ---------- */}
      {active==="comparative" && (
        <Section title="Comparative Performance Analysis" sub="Red = worst in row · Green = best in row · click any figure for detail" accent={P.purple}>
          <div style={{ overflowX:"auto", marginBottom:28 }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead><tr><th style={THs("left")}>CATEGORY</th>
                {D.units.map(u=><th key={u.unitName+u.fy} style={THs()}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                    <div style={{width:7,height:7,borderRadius:"50%",background:uc(u.unitName)}}/>{u.unitName}</div></th>)}</tr></thead>
              <tbody>
                {[["Total Observations","total",true],["Critical","critical",true],["High","high",true],
                  ["Medium","medium",false],["Low","low",false],["Repeated Obs","repeatedCount",true],
                  ["Limitations","limitations",true]].map(([label,key,badHigh],i)=>{
                  const vals=D.units.map(u=>u[key]).filter(v=>typeof v==="number");
                  const max=Math.max(...vals),min=Math.min(...vals);
                  return (
                    <tr key={key} style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}` }}>
                      <td style={TDs("left",{fontWeight:600,color:P.mid})}>{label}</td>
                      {D.units.map(u=>{
                        const v=u[key];
                        let hl={};
                        if(badHigh&&v===max&&max!==min) hl={background:"#FEF2F2",color:P.red,fontWeight:800};
                        else if(badHigh&&v===min&&max!==min) hl={background:P.greenLt,color:P.green,fontWeight:800};
                        const capMap={critical:"Critical",high:"High",medium:"Medium",low:"Low"};
                        const click = key==="total" ? ()=>show(`All observations — ${u.unitName}`,by(o=>o.unit===u.unitName))
                          : capMap[key] ? ()=>show(`${capMap[key]} — ${u.unitName}`,by(o=>o.unit===u.unitName&&o.risk_level===capMap[key]))
                          : key==="repeatedCount" ? ()=>show(`Repeated — ${u.unitName}`,by(o=>o.unit===u.unitName&&o.is_repeated)) : null;
                        return <td key={u.unitName} onClick={click||undefined}
                          style={{...TDs(),...hl,cursor:click?"pointer":"default"}}>{v ?? "—"}</td>;
                      })}
                    </tr>
                  );
                })}
                <tr style={{ background:"#F8FAFC", borderTop:`2px solid ${P.border}` }}>
                  <td style={TDs("left",{fontWeight:700,color:P.mid})}>Weakest Area</td>
                  {D.units.map(u=><td key={u.unitName} style={TDs("center",{fontSize:11,color:P.muted})}>{u.weakestArea}</td>)}
                </tr>
                <tr style={{ background:"#F8FAFC" }}>
                  <td style={TDs("left",{fontWeight:700,color:P.mid})}>Highest Critical Area</td>
                  {D.units.map(u=><td key={u.unitName} style={TDs("center",{fontSize:11,color:P.red,fontWeight:600})}>{u.highestCriticalArea}</td>)}
                </tr>
              </tbody>
            </table>
          </div>
          
        </Section>
      )}

      {/* ---------- AREA-WISE ---------- */}
      {active==="areawise" && (() => {
        const sel = selUnit || U[0];
        const u = D.units.find(x=>x.unitName===sel) || D.units[0];
        return (
          <Section title="Area-wise Observations" sub="Select a unit to view its breakdown · click any figure for detail" accent={P.green}>
            <div style={{ display:"flex", gap:8, marginBottom:20, flexWrap:"wrap" }}>
              {U.map(n=>(
                <button key={n} onClick={()=>setSelUnit(n)} style={{ display:"flex", alignItems:"center", gap:6,
                  background:sel===n?uc(n):"#F1F5F9", color:sel===n?"#fff":P.mid,
                  border:`2px solid ${sel===n?uc(n):"transparent"}`, borderRadius:8, padding:"7px 16px",
                  fontWeight:700, fontSize:13, cursor:"pointer" }}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:sel===n?"rgba(255,255,255,.6)":uc(n)}}/>{n}
                </button>
              ))}
            </div>
            <div style={{ display:"flex", gap:12, marginBottom:18, flexWrap:"wrap" }}>
              {["critical","high","medium","low"].map(k=>{
                const cap=k[0].toUpperCase()+k.slice(1);
                return (
                  <div key={k} onClick={()=>show(`${cap} — ${u.unitName}`,by(o=>o.unit===u.unitName&&o.risk_level===cap))}
                    style={{ background:RISK[cap]+"14", border:`1px solid ${RISK[cap]}40`, borderRadius:9,
                      padding:"10px 16px", minWidth:80, cursor:"pointer" }}>
                    <div style={{fontSize:10,fontWeight:700,color:RISK[cap],letterSpacing:.5}}>{cap.toUpperCase()}</div>
                    <div style={{fontSize:26,fontWeight:900,color:RISK[cap],lineHeight:1.1}}>{u[k]}</div>
                  </div>
                );
              })}
              <div onClick={()=>show(`All observations — ${u.unitName}`,by(o=>o.unit===u.unitName))}
                style={{ background:"#F8FAFC", border:`1px solid ${P.border}`, borderRadius:9, padding:"10px 16px", minWidth:80, cursor:"pointer" }}>
                <div style={{fontSize:10,fontWeight:700,color:P.muted,letterSpacing:.5}}>TOTAL</div>
                <div style={{fontSize:26,fontWeight:900,color:P.ink,lineHeight:1.1}}>{u.total}</div>
              </div>
            </div>
            <div style={{ marginBottom:18 }}>
              <Stack c={u.critical} h={u.high} m={u.medium} l={u.low} t={u.total} height={10}/>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr>{["AREA","CRITICAL","HIGH","MEDIUM","LOW","TOTAL","SPLIT"].map(h=>
                  <th key={h} style={h==="AREA"?THs("left"):THs()}>{h}</th>)}</tr></thead>
                <tbody>
                  {Object.entries(u.areas).sort((a,b)=>b[1].t-a[1].t).map(([area,v],i)=>(
                    <tr key={area} style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}` }}>
                      <td style={TDs("left",{fontWeight:600,color:P.mid})}>
                        <span onClick={()=>show(`${area} — ${u.unitName}`,by(o=>o.unit===u.unitName&&o.area===area))}
                          style={{cursor:"pointer",textDecoration:"underline dotted",textUnderlineOffset:3}}>{area}</span></td>
                      {["c","h","m","l"].map(k=>{
                        const rk={c:"Critical",h:"High",m:"Medium",l:"Low"}[k];
                        return <td key={k} style={TDs()}><Num value={v[k]} color={RISK[rk]}
                          onClick={()=>show(`${rk} — ${area} · ${u.unitName}`,by(o=>o.unit===u.unitName&&o.area===area&&o.risk_level===rk))}/></td>;
                      })}
                      <td style={TDs("center")}><Num value={v.t} bold
                        onClick={()=>show(`${area} — ${u.unitName}`,by(o=>o.unit===u.unitName&&o.area===area))}/></td>
                      <td style={{padding:"9px 12px"}}><Stack c={v.c} h={v.h} m={v.m} l={v.l} t={v.t} height={6}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Section>
        );
      })()}

      {/* ---------- COMMON OBSERVATIONS ---------- */}
      {active==="common" && (() => {
        const procs=["All",...new Set(D.commonObservations.map(o=>o.process))];
        const list = filter==="All" ? D.commonObservations : D.commonObservations.filter(o=>o.process===filter);
        return (
          <Section title="Common Observations" sub="The same observation raised in more than one unit — systemic gaps needing head-office action" accent={P.blue}>
            {D.commonObservations.length===0 ? (
              <div style={{padding:30,textAlign:"center",color:P.muted,fontSize:13}}>
                No common observations have been marked yet. The audit team sets these in the Staff Portal by downloading the observations Excel, marking which issues are common across units, and uploading it back.
              </div>
            ) : (<>
              <div style={{ display:"flex", gap:8, marginBottom:18, flexWrap:"wrap" }}>
                {procs.map(p=>(
                  <button key={p} onClick={()=>setFilter(p)} style={{ background:filter===p?P.blue:"#F1F5F9",
                    color:filter===p?"#fff":P.mid, border:"none", borderRadius:7, padding:"5px 14px",
                    fontWeight:600, fontSize:12, cursor:"pointer" }}>{p}</button>
                ))}
              </div>
              <div style={{ overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr>
                    <th style={THs("left")}>PROCESS</th><th style={THs("left")}>OBSERVATION</th><th style={THs()}>RISK</th>
                    {U.map(n=><th key={n} style={{...THs(),minWidth:70}}>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:uc(n)}}/>
                        <span style={{fontSize:10}}>{n}</span></div></th>)}
                    <th style={THs()}>UNITS</th></tr></thead>
                  <tbody>
                    {list.map((o,i)=>(
                      <tr key={i} style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}` }}>
                        <td style={TDs("left",{fontWeight:600,color:P.mid,whiteSpace:"nowrap",fontSize:12})}>{o.process}</td>
                        <td style={TDs("left",{color:P.slate,fontSize:12,maxWidth:300})}>
                          <span onClick={()=>show(o.title,o.obs)} style={{cursor:"pointer",textDecoration:"underline dotted",textUnderlineOffset:3}}>{o.title}</span></td>
                        <td style={TDs()}><span style={{background:(RISK[o.risk]||P.muted)+"18",color:RISK[o.risk]||P.muted,
                          borderRadius:4,padding:"2px 8px",fontSize:11,fontWeight:700}}>{o.risk}</span></td>
                        {U.map(n=>(
                          <td key={n} style={TDs()}>
                            {o.unitList.includes(n)
                              ? <span onClick={()=>show(`${o.title} — ${n}`,o.obs.filter(x=>x.unit===n))}
                                  style={{color:P.green,fontSize:16,lineHeight:1,cursor:"pointer"}}>✓</span>
                              : <span style={{color:"#E5E7EB",fontSize:13}}>—</span>}
                          </td>
                        ))}
                        <td style={TDs()}><Num value={o.unitList.length} color={P.blue} onClick={()=>show(o.title,o.obs)}/></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>)}
          </Section>
        );
      })()}

      {/* ---------- REPEATED ---------- */}
      {active==="repeated" && (() => {
        const areas=Object.keys(D.repeatedObsByArea);
        return (
          <Section title="Repeated Observations" sub="Raised again this year — not actioned since the prior audit" accent={P.red}>
            {areas.length===0 ? (
              <div style={{padding:30,textAlign:"center",color:P.muted,fontSize:13}}>No repeated observations in the uploaded reports.</div>
            ) : (<>
              <div style={{ overflowX:"auto", marginBottom:24 }}>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr style={{background:"#FEF2F2"}}>
                    <th style={THs("left")}>PROCESS</th>
                    {U.map(n=><th key={n} style={{...THs(),color:"#991B1B"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:uc(n)}}/>{n}</div></th>)}
                    <th style={{...THs(),color:"#991B1B"}}>TOTAL</th></tr></thead>
                  <tbody>
                    {areas.map((area,i)=>{
                      const tot=U.reduce((a,n)=>a+(D.repeatedObsByArea[area][n]||0),0);
                      return (
                        <tr key={area} style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}` }}>
                          <td style={TDs("left",{fontWeight:600,color:P.mid})}>{area}</td>
                          {U.map(n=><td key={n} style={TDs()}><Num value={D.repeatedObsByArea[area][n]||0} color={P.red}
                            onClick={()=>show(`Repeated — ${area} · ${n}`,by(o=>o.area===area&&o.unit===n&&o.is_repeated))}/></td>)}
                          <td style={TDs("center")}><Num value={tot} color={P.red} bold
                            onClick={()=>show(`Repeated — ${area}`,by(o=>o.area===area&&o.is_repeated))}/></td>
                        </tr>
                      );
                    })}
                    <tr style={{ background:"#FEF2F2", borderTop:`2px solid ${P.redBd}` }}>
                      <td style={TDs("left",{fontWeight:800,color:P.ink})}>Total</td>
                      {U.map(n=>{const t=areas.reduce((a,ar)=>a+(D.repeatedObsByArea[ar][n]||0),0);
                        return <td key={n} style={TDs("center",{fontWeight:900,color:P.red})}>{t}</td>;})}
                      <td style={TDs("center",{fontWeight:900,color:P.red})}>{D.repeatedTotals.repeated}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              
            </>)}
          </Section>
        );
      })()}

      {/* ---------- PRIOR YEAR OPEN ---------- */}
      {active==="prioryear" && (() => {
        const areas=Object.keys(D.priorOpenByArea);
        const totalOpen = by(o=>o.is_repeated&&o.pending_since_days).length;
        return (
          <Section title="Previous Year Open Observations" sub="Raised in an earlier audit and still not closed" accent={P.purple}>
            {areas.length===0 ? (
              <div style={{padding:30,textAlign:"center",color:P.muted,fontSize:13}}>
                No prior-year open observations recorded. These come from the report's "Previous Audit Non-Compliance" section. If the report has that section, re-extract it with the latest prompt.
              </div>
            ) : (<>
              <div style={{ overflowX:"auto", marginBottom:24 }}>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead><tr style={{background:"#F5F3FF"}}>
                    <th style={{...THs("left"),color:"#6D28D9"}}>PROCESS</th>
                    {U.map(n=><th key={n} style={{...THs(),color:"#6D28D9"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:uc(n)}}/>{n}</div></th>)}
                    <th style={{...THs(),color:"#6D28D9"}}>TOTAL</th></tr></thead>
                  <tbody>
                    {areas.map((area,i)=>{
                      const tot=U.reduce((a,n)=>a+(D.priorOpenByArea[area][n]||0),0);
                      return (
                        <tr key={area} style={{ background:i%2===0?P.white:"#FAFAFA", borderBottom:`1px solid ${P.border}` }}>
                          <td style={TDs("left",{fontWeight:600,color:P.mid})}>{area}</td>
                          {U.map(n=><td key={n} style={TDs()}><Num value={D.priorOpenByArea[area][n]||0} color={P.purple}
                            onClick={()=>show(`Prior-year open — ${area} · ${n}`,by(o=>o.area===area&&o.unit===n&&o.is_repeated&&o.pending_since_days))}/></td>)}
                          <td style={TDs("center")}><Num value={tot} color={P.purple} bold
                            onClick={()=>show(`Prior-year open — ${area}`,by(o=>o.area===area&&o.is_repeated&&o.pending_since_days))}/></td>
                        </tr>
                      );
                    })}
                    <tr style={{ background:"#F5F3FF", borderTop:"2px solid #DDD6FE" }}>
                      <td style={TDs("left",{fontWeight:800,color:P.ink})}>Total</td>
                      {U.map(n=>{const t=areas.reduce((a,ar)=>a+(D.priorOpenByArea[ar][n]||0),0);
                        return <td key={n} style={TDs("center",{fontWeight:900,color:P.purple})}>{t}</td>;})}
                      <td style={TDs("center",{fontWeight:900,color:P.purple})}>{totalOpen}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              
            </>)}
          </Section>
        );
      })()}

      {/* ---------- LIMITATIONS ---------- */}
      {active==="limitations" && (
        <Section title="Unit-wise Limitations" sub="Data not provided to the auditors — impacts completeness of findings" accent={P.muted}>
          {D.limitationsRollup.length===0 ? (
            <div style={{padding:30,textAlign:"center",color:P.muted,fontSize:13}}>No scope limitations recorded in the uploaded reports.</div>
          ) : (<>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))", gap:14, marginBottom:20 }}>
              {[...D.units].sort((a,b)=>b.limitations-a.limitations).map(u=>(
                <div key={u.unitName+u.fy} style={{ background:u.limitations>20?"#FEF2F2":u.limitations>10?"#FFFBEB":P.greenLt,
                  borderRadius:10, padding:"16px 18px", borderLeft:`4px solid ${uc(u.unitName)}` }}>
                  <div style={{fontSize:11,fontWeight:700,color:P.muted,marginBottom:4}}>{u.unitName.toUpperCase()}</div>
                  <div style={{fontSize:32,fontWeight:900,lineHeight:1,
                    color:u.limitations>20?P.red:u.limitations>10?P.amber:P.green}}>{u.limitations}</div>
                  <div style={{fontSize:11,color:P.muted,marginTop:4}}>limitations</div>
                </div>
              ))}
            </div>
            <div style={{fontSize:13,fontWeight:700,color:P.mid,marginBottom:10}}>By Area — click to see what was not provided</div>
            {D.limitationsRollup.map(row=>{
              const open=openLim===row.area;
              return (
                <div key={row.area} style={{ marginBottom:8, border:`1px solid ${open?P.blueBd:P.border}`, borderRadius:10, overflow:"hidden" }}>
                  <div onClick={()=>setOpenLim(open?null:row.area)}
                    style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", cursor:"pointer", background:open?P.blueLt:P.white }}>
                    <span style={{fontSize:12,color:P.muted,transform:open?"rotate(90deg)":"none"}}>▶</span>
                    <div style={{flex:1,fontWeight:700,color:P.slate,fontSize:14}}>{row.area}</div>
                    <span style={{fontSize:11,color:P.muted}}>{row.unitCount} unit{row.unitCount>1?"s":""} affected</span>
                  </div>
                  {open && (
                    <div style={{ borderTop:`1px solid ${P.border}`, background:"#FBFCFE", padding:"12px 16px" }}>
                      {Object.entries(row.itemsByUnit).map(([n,items])=>(
                        <div key={n} style={{marginBottom:10}}>
                          <div style={{fontSize:12,fontWeight:700,color:P.slate,marginBottom:4}}>{n}</div>
                          <div style={{fontSize:12,color:P.mid,paddingLeft:12}}>{items.map((it,ii)=><div key={ii}>• {it}</div>)}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </>)}
        </Section>
      )}

      {drill && <DrillPanel title={drill.title} obs={drill.obs} onClose={()=>setDrill(null)}/>}
    </div>
  );
}


function ReportView({ report, onBack, showToast }) {
  const [openArea,setOpenArea]=useState(null);
  const [openObs,setOpenObs]=useState(null);
  const j=report.report_json;
  if(!j||!j.audit_summary) return (
    <div style={{maxWidth:1200,margin:"0 auto",padding:"28px"}}>
      <span onClick={onBack} style={{fontSize:13,color:P.blue,cursor:"pointer",fontWeight:600}}>← Back to all reports</span>
      <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"40px",textAlign:"center",marginTop:18,color:P.muted}}>
        This report has no structured data attached.</div>
    </div>
  );
  const risk=j.audit_summary.observation_count_by_risk||{};
  const total=(risk.critical||0)+(risk.high||0)+(risk.medium||0)+(risk.low||0);
  const meta=j.report_metadata||{};
  const repeatedCount=(j.areas||[]).reduce((n,a)=>n+(a.observations||[]).filter(o=>o.is_repeated).length,0);
  const rootCauseMap={};
  (j.areas||[]).forEach(a=>(a.observations||[]).forEach(o=>{ const rc=o.root_cause||"Not stated"; rootCauseMap[rc]=(rootCauseMap[rc]||0)+1; }));
  const rootCauseRollup=Object.entries(rootCauseMap).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);

  const download=async(path)=>{
    if(!path) return;
    try{
      const {data,error}=await sb.storage.from("reports").createSignedUrl(path,120);
      if(error) throw new Error(error.message);
      window.open(data.signedUrl,"_blank");
    }catch(e){ showToast("Could not open file: "+e.message,"error"); }
  };

  return (
    <div style={{maxWidth:1200,margin:"0 auto",padding:"28px"}}>
      <div style={{marginBottom:18}}>
        <span onClick={onBack} style={{fontSize:13,color:P.blue,cursor:"pointer",fontWeight:600}}>← Back to all reports</span>
      </div>
      <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"24px",marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:14}}>
          <div>
            <h1 style={{fontSize:22,fontWeight:900,color:P.slate,marginBottom:4}}>{report.client_name}</h1>
            <div style={{fontSize:14,color:P.mid}}>{report.unit_name} · FY {report.fy}</div>
            {report.period&&<div style={{fontSize:12,color:P.muted,marginTop:6}}>Period: {report.period}</div>}
            {report.udin&&<div style={{fontSize:12,color:P.muted}}>UDIN: {report.udin}</div>}
            {meta.auditors&&<div style={{fontSize:12,color:P.muted}}>Auditors: {Array.isArray(meta.auditors)?meta.auditors.join(", "):meta.auditors}</div>}
          </div>
          <div style={{textAlign:"right"}}>
            {meta.overall_rating&&<>
              <div style={{fontSize:11,fontWeight:700,color:P.muted,marginBottom:4}}>OVERALL RATING</div>
              <div style={{background:P.greenLt,color:P.green,border:`1px solid ${P.greenBd}`,borderRadius:8,padding:"8px 16px",fontSize:15,fontWeight:800}}>{meta.overall_rating}</div>
            </>}
            <div style={{marginTop:10,display:"flex",gap:6,justifyContent:"flex-end",flexWrap:"wrap"}}>
              {report.report_file&&<Btn size="sm" color="gray" onClick={()=>download(report.report_file)}>⬇ Download Report</Btn>}
              {report.annexure_file&&<Btn size="sm" color="gray" onClick={()=>download(report.annexure_file)}>⬇ Annexure</Btn>}
            </div>
          </div>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:18}}>
        {[["Total Observations",total,P.slate],["Repeated",repeatedCount,P.amber],["Critical",risk.critical||0,RISK.Critical],["High",risk.high||0,RISK.High],
          ["Medium",risk.medium||0,RISK.Medium],["Low",risk.low||0,RISK.Low]].map(([l,v,c])=>(
          <div key={l} style={{background:P.white,borderRadius:12,border:`1px solid ${P.border}`,padding:"18px"}}>
            <div style={{fontSize:11,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:6}}>{l.toUpperCase()}</div>
            <div style={{fontSize:28,fontWeight:900,color:c}}>{v}</div></div>))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:18}}>
        <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px"}}>
          <div style={{fontSize:15,fontWeight:800,color:P.slate,marginBottom:8}}>Observations by Risk Level</div>
          <RiskDonut risk={risk}/>
        </div>
        <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px"}}>
          <div style={{fontSize:15,fontWeight:800,color:P.slate,marginBottom:8}}>Observations by Root Cause</div>
          <RootCauseDonut rootCauseRollup={rootCauseRollup}/>
        </div>
      </div>

      <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px",marginBottom:18}}>
        <div style={{fontSize:15,fontWeight:800,color:P.slate,marginBottom:6}}>Area-wise Observations</div>
        <div style={{fontSize:12,color:P.muted,marginBottom:16}}>Click an area to see its observations, then click an observation for full detail.</div>
        {(j.audit_summary.area_wise_summary||[]).map(row=>{
          const isOpen=openArea===row.area;
          const area=(j.areas||[]).find(a=>a.area_name===row.area);
          return (
            <div key={row.area} style={{marginBottom:8,border:`1px solid ${isOpen?P.blueBd:P.border}`,borderRadius:10,overflow:"hidden"}}>
              <div onClick={()=>{setOpenArea(isOpen?null:row.area);setOpenObs(null);}}
                style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",cursor:"pointer",background:isOpen?P.blueLt:P.white}}>
                <span style={{fontSize:12,color:P.muted,transform:isOpen?"rotate(90deg)":"none"}}>▶</span>
                <div style={{flex:1,fontWeight:700,color:P.slate,fontSize:14}}>{row.area}</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {[["C",row.critical,RISK.Critical],["H",row.high,RISK.High],["M",row.medium,RISK.Medium],["L",row.low,RISK.Low]]
                    .map(([k,v,c])=>v>0?<span key={k} style={{background:c,color:"#fff",borderRadius:5,padding:"2px 8px",fontSize:11,fontWeight:800}}>{k} {v}</span>:null)}
                </div>
                <div style={{fontSize:13,fontWeight:800,color:P.slate,minWidth:28,textAlign:"right"}}>{row.total}</div>
              </div>
              {isOpen&&area&&(
                <div style={{borderTop:`1px solid ${P.border}`,background:"#FBFCFE"}}>
                  {(area.observations||[]).map((obs,oi)=>(
                    <div key={oi}>
                      <div onClick={()=>setOpenObs(openObs===`${row.area}-${oi}`?null:`${row.area}-${oi}`)}
                        style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px 11px 42px",cursor:"pointer",
                          borderBottom:`1px solid ${P.border}`,background:openObs===`${row.area}-${oi}`?P.white:"transparent"}}>
                        <span style={{width:8,height:8,borderRadius:"50%",background:RISK[obs.risk_level]||P.muted,flexShrink:0}}/>
                        <div style={{flex:1,fontSize:13,color:P.slate,fontWeight:600}}>{obs.title}</div>
                        {obs.is_repeated&&<span style={{background:P.amberLt,color:P.amber,border:`1px solid ${P.amberBd}`,borderRadius:5,padding:"2px 8px",fontSize:10,fontWeight:800}}>REPEATED</span>}
                        <span style={{background:(RISK[obs.risk_level]||P.muted)+"18",color:RISK[obs.risk_level]||P.muted,
                          borderRadius:5,padding:"2px 9px",fontSize:11,fontWeight:700}}>{obs.risk_level}</span>
                      </div>
                      {openObs===`${row.area}-${oi}`&&(
                        <div style={{padding:"16px 20px 20px 42px",background:P.white,borderBottom:`1px solid ${P.border}`}}>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
                            <div><div style={{fontSize:10,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:3}}>RESPONSIBLE</div>
                              <div style={{fontSize:13,color:P.slate,fontWeight:600}}>{obs.responsible||"—"}</div></div>
                            <div><div style={{fontSize:10,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:3}}>TARGET DATE</div>
                              <div style={{fontSize:13,color:P.slate,fontWeight:600}}>{obs.target_date||"—"}</div></div>
                          </div>
                          {obs.is_repeated&&<div style={{background:P.amberLt,border:`1px solid ${P.amberBd}`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:P.amber}}>
                            <strong>Repeated from a prior audit</strong>{obs.pending_since_days?` — pending ${obs.pending_since_days} days`:""}</div>}
                          {obs.observation&&<div style={{marginBottom:14}}>
                            <div style={{fontSize:10,fontWeight:700,color:P.muted,letterSpacing:.5,marginBottom:4}}>OBSERVATION</div>
                            <div style={{fontSize:13,color:P.mid,lineHeight:1.6}}>{obs.observation}</div></div>}
                          {obs.action_plan&&<div style={{background:P.greenLt,border:`1px solid ${P.greenBd}`,borderRadius:8,padding:"12px 14px"}}>
                            <div style={{fontSize:10,fontWeight:700,color:P.green,letterSpacing:.5,marginBottom:4}}>MANAGEMENT ACTION PLAN</div>
                            <div style={{fontSize:13,color:"#166534",lineHeight:1.6}}>{obs.action_plan}</div></div>}
                        </div>)}
                    </div>))}
                </div>)}
            </div>);
        })}
      </div>

      {(j.limitations||[]).length>0 && (
        <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"22px",marginTop:18}}>
          <div style={{fontSize:15,fontWeight:800,color:P.slate,marginBottom:6}}>Scope Limitations</div>
          <div style={{fontSize:12,color:P.muted,marginBottom:16}}>Data not made available to the auditors during this engagement.</div>
          {j.limitations.map((lim,li)=>(
            <div key={li} style={{marginBottom:12,paddingBottom:12,borderBottom:li<j.limitations.length-1?`1px solid ${P.border}`:"none"}}>
              <div style={{fontSize:13,fontWeight:700,color:P.slate,marginBottom:6}}>{lim.area}</div>
              <div style={{fontSize:12,color:P.mid,paddingLeft:12}}>
                {(lim.items||[]).map((it,ii)=>(<div key={ii} style={{marginBottom:2}}>• {it}</div>))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [authState,setAuthState]=useState("loading");
  const [viewer,setViewer]=useState(null);
  const [reports,setReports]=useState([]);
  const [commonRows,setCommonRows]=useState([]);
  const [viewMode,setViewMode]=useState("consolidated");  // "consolidated" | "individual"
  const [openId,setOpenId]=useState(null);
  const [toast,setToast]=useState(null);
  const showToast=(msg,type="success")=>setToast({msg,type});

  const load=async(email)=>{
    const {data:acc}=await sb.from("client_access").select("*").eq("status","Active");
    const mine=(acc||[]).filter(a=>a.email?.toLowerCase()===email);
    // reports RLS already limits rows to what this viewer may see
    const {data:reps}=await sb.from("reports").select("*").eq("status","Live").order("id",{ascending:false});
    if(!mine.length && !(reps||[]).length){ setAuthState("denied"); return; }
    const clientName = mine[0]?.client_name || (reps||[])[0]?.client_name || "";
    setViewer({ email, name:mine[0]?.name||email, designation:mine[0]?.designation||"",
      clientName, levels:mine.map(m=>m.access_level) });
    setReports(reps||[]);
    if(clientName){
      const {data:cr}=await sb.from("common_observations").select("*").eq("client_name",clientName);
      setCommonRows(cr||[]);
    }
    setAuthState("ready");
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{
      if(data.session) load(data.session.user.email.toLowerCase()); else setAuthState("login");
    });
    const {data:sub}=sb.auth.onAuthStateChange((_e,sess)=>{
      if(sess) load(sess.user.email.toLowerCase()); else { setViewer(null); setAuthState("login"); }
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const signOut=async()=>{ await sb.auth.signOut(); };

  if(authState==="loading") return <div style={{minHeight:"100vh",background:P.ink,display:"flex",alignItems:"center",justifyContent:"center",color:"#9CA3AF",fontSize:14}}>Loading...</div>;
  if(authState==="login") return <LoginScreen/>;
  if(authState==="denied") return (
    <div style={{minHeight:"100vh",background:P.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:P.redLt,border:`1px solid ${P.redBd}`,borderRadius:14,padding:"32px",maxWidth:480,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:12}}>🔒</div>
        <div style={{fontSize:17,fontWeight:800,color:P.red,marginBottom:8}}>No Dashboard Access</div>
        <div style={{fontSize:13,color:"#991B1B",marginBottom:20}}>
          Your email is verified, but no reports have been shared with this address. Please contact NCLS & Associates.</div>
        <Btn color="red" outline onClick={signOut}>Sign out</Btn>
      </div>
    </div>
  );

  const open=openId?reports.find(r=>r.id===openId):null;

  return (
    <div style={{minHeight:"100vh",background:P.bg}}>
      <div style={{background:P.ink,padding:"0 28px",position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:54,flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:30,height:30,background:P.blue,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:"#fff"}}>N</div>
            <span style={{fontWeight:800,color:"#F8FAFC",fontSize:14}}>NCLS & Associates</span>
            <span style={{color:"#374151"}}>·</span>
            <span style={{fontSize:13,color:"#9CA3AF"}}>Audit Dashboard</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:12,color:"#6B7280"}}>{viewer.name}{viewer.designation?` · ${viewer.designation}`:""}</span>
            <button onClick={signOut} style={{background:"#1C2333",color:"#9CA3AF",border:"1px solid #2D3748",borderRadius:7,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Sign out</button>
          </div>
        </div>
      </div>

      {open ? <ReportView report={open} onBack={()=>setOpenId(null)} showToast={showToast}/> : (
        <div style={{maxWidth:1200,margin:"0 auto",padding:"28px"}}>
          <div style={{marginBottom:22}}>
            <h1 style={{fontSize:22,fontWeight:900,color:P.slate,marginBottom:4}}>{viewer.clientName}</h1>
            <p style={{fontSize:13,color:P.muted}}>
              Signed in as <strong>{viewer.name}</strong>{viewer.designation?`, ${viewer.designation}`:""} · {viewer.email}
            </p>
          </div>
          {reports.length===0?(
            <div style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"48px 24px",textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:12}}>📭</div>
              <div style={{fontSize:16,fontWeight:800,color:P.slate,marginBottom:6}}>No published reports yet</div>
              <div style={{fontSize:13,color:P.muted}}>Reports appear here once they are published by NCLS & Associates.</div>
            </div>
          ):(<>
          {new Set(reports.map(r=>r.unit_name)).size>1 && (
            <div style={{display:"flex",gap:8,marginBottom:20,background:P.white,border:`1px solid ${P.border}`,
              borderRadius:10,padding:5,width:"fit-content"}}>
              {[["consolidated","Consolidated View"],["individual","Individual Reports"]].map(([id,label])=>(
                <button key={id} onClick={()=>setViewMode(id)} style={{
                  background:viewMode===id?P.blue:"transparent", color:viewMode===id?"#fff":P.mid,
                  border:"none", borderRadius:7, padding:"8px 18px", fontSize:13,
                  fontWeight:viewMode===id?700:500, cursor:"pointer" }}>{label}</button>
              ))}
            </div>
          )}
          {new Set(reports.map(r=>r.unit_name)).size>1 && viewMode==="consolidated" ? (
            <ConsolidatedView clientName={viewer.clientName} reports={reports} commonRows={commonRows} onSelectUnit={r=>setOpenId(r.id)}/>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:16}}>
              {reports.map(r=>{
                const risk=r.report_json?.audit_summary?.observation_count_by_risk||{};
                const total=(risk.critical||0)+(risk.high||0)+(risk.medium||0)+(risk.low||0);
                return (
                  <div key={r.id} onClick={()=>setOpenId(r.id)}
                    style={{background:P.white,borderRadius:14,border:`1px solid ${P.border}`,padding:"20px",cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,gap:8}}>
                      <div><div style={{fontSize:16,fontWeight:800,color:P.slate}}>{r.unit_name}</div>
                        <div style={{fontSize:12,color:P.muted,marginTop:2}}>FY {r.fy}</div></div>
                      <span style={{background:P.greenLt,color:P.green,border:`1px solid ${P.greenBd}`,borderRadius:5,padding:"2px 9px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>Published</span>
                    </div>
                    <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
                      {[["Critical",risk.critical||0,RISK.Critical],["High",risk.high||0,RISK.High],
                        ["Medium",risk.medium||0,RISK.Medium],["Low",risk.low||0,RISK.Low]].map(([l,v,c])=>(
                        <div key={l} style={{flex:1,minWidth:58,background:c+"12",borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
                          <div style={{fontSize:18,fontWeight:900,color:c}}>{v}</div>
                          <div style={{fontSize:9,fontWeight:700,color:c}}>{l.toUpperCase()}</div></div>))}
                    </div>
                    {r.report_json?.audit_summary?.executive_summary && (
                      <div style={{fontSize:12,color:P.mid,lineHeight:1.55,marginBottom:12,
                        display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
                        {r.report_json.audit_summary.executive_summary}
                      </div>
                    )}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:12,borderTop:`1px solid ${P.border}`}}>
                      <span style={{fontSize:12,color:P.muted}}>{total} observations</span>
                      <span style={{fontSize:12,color:P.blue,fontWeight:700}}>View full report →</span></div>
                  </div>);})}
            </div>
          )}
          </>)}
        </div>)}

      {toast&&<div style={{position:"fixed",bottom:24,right:24,zIndex:100,background:toast.type==="error"?P.redLt:P.greenLt,
        color:toast.type==="error"?P.red:P.green,border:`1px solid ${toast.type==="error"?P.redBd:P.greenBd}`,
        borderRadius:10,padding:"12px 18px",fontSize:13,fontWeight:600,maxWidth:360}}>{toast.msg}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
<script>
  window.addEventListener('error',function(e){
    const r=document.getElementById('root');
    if(r&&!r.hasChildNodes()) {
      const detail = (e.message && e.message !== 'Script error.')
        ? e.message
        : (e.message||'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + (e.lineno?':'+e.lineno:'') + ')' : '');
      r.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#DC2626;background:#FEF2F2;border-radius:12px;margin:40px auto;max-width:500px;border:1px solid #FECACA"><h2>Dashboard failed to load</h2><p>'+detail+'</p></div>';
    }
  });

  // Fetch a UMD script and run it with module/exports/define hidden, so its UMD
  // wrapper is forced down the "attach to window" branch instead of the CommonJS
  // or AMD branch. Other libraries on the page can otherwise leave those defined.
  function loadScript(src) {
    return fetch(src).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' loading ' + src);
      return res.text();
    }).then(function(code) {
      const s = document.createElement('script');
      s.textContent =
        '(function(module, exports, define){\n' + code + '\n}).call(window, undefined, undefined, undefined);';
      document.head.appendChild(s);
    });
  }

  // Try the primary CDN, fall back to the secondary, then confirm the library
  // actually registered the global it is supposed to.
  function loadLib(name, globalName, primary, fallback) {
    return loadScript(primary)
      .catch(function(err1){
        return loadScript(fallback)
          .catch(function(err2){ throw new Error(name + ' could not be downloaded (' + err1.message + ' / ' + err2.message + ')'); });
      })
      .then(function(){
        if (typeof window[globalName] === 'undefined')
          throw new Error(name + ' loaded but did not register window.' + globalName);
      });
  }

  function loadCharting() {
    return loadLib('prop-types', 'PropTypes',
        'https://unpkg.com/prop-types@15.8.1/prop-types.min.js',
        'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js')
      .then(function(){
        return loadLib('Recharts', 'Recharts',
          'https://unpkg.com/recharts@2.12.7/umd/Recharts.js',
          'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js');
      });
  }

  loadCharting().then(function() {
    try {
      const src=document.getElementById('app-source').textContent;
      const out=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]}).code;
      const s=document.createElement('script'); s.textContent=out; document.body.appendChild(s);
    } catch (renderErr) {
      const r=document.getElementById('root');
      r.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#DC2626;background:#FEF2F2;border-radius:12px;margin:40px auto;max-width:500px;border:1px solid #FECACA"><h2>Dashboard failed to load</h2><p>'+(renderErr.message||'Unknown error while starting the app')+'</p></div>';
    }
  }).catch(function(err) {
    const r=document.getElementById('root');
    r.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#DC2626;background:#FEF2F2;border-radius:12px;margin:40px auto;max-width:500px;border:1px solid #FECACA"><h2>Dashboard failed to load</h2><p>The charting library could not be downloaded: '+(err.message||'unknown error')+'</p><p style="font-size:13px;color:#7F1D1D">This usually means something on this network or device is blocking downloads from unpkg.com and cdn.jsdelivr.net — try a different network, or check with your IT/network admin about allowing those two sites.</p></div>';
  });
</script>
